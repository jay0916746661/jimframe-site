<style>
/* Layout: iOS-style app — grouped gray background, white inset cards, large titles, translucent tab bar with line icons. Plain system type, one blue accent. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:#EEEEF0; --ink:#1D1D1F; --muted:#6E6E73; --line:#E3E3E8;
  --cobalt:#007AFF; --cobalt-soft:#E5F0FF; --on-cobalt:#FFFFFF;
  --marigold:#FF9500; --marigold-soft:#FFF2E0;
  --chile:#FF3B30; --chile-soft:#FFE9E7; --nopal:#34C759; --nopal-soft:#E5F8EA;
  --bar:rgba(242,242,247,.86);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Helvetica Neue","Noto Sans TC",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#F5F5F7; --muted:#98989F; --line:#2E2E31;
  --cobalt:#0A84FF; --cobalt-soft:#0A84FF26; --on-cobalt:#FFFFFF;
  --marigold:#FF9F0A; --marigold-soft:#FF9F0A24;
  --chile:#FF453A; --chile-soft:#FF453A24; --nopal:#30D158; --nopal-soft:#30D15824;
  --bar:rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#F5F5F7; --muted:#98989F; --line:#2E2E31;
  --cobalt:#0A84FF; --cobalt-soft:#0A84FF26; --on-cobalt:#FFFFFF;
  --marigold:#FF9F0A; --marigold-soft:#FF9F0A24;
  --chile:#FF453A; --chile-soft:#FF453A24; --nopal:#30D158; --nopal-soft:#30D15824;
  --bar:rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-family:var(--f-display);font-size:1.75rem;font-weight:700;line-height:1.2}
h2{font-size:1.1rem;font-weight:600;line-height:1.3}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--cobalt);text-decoration:none}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:17px;background:var(--sunk);border:0;border-radius:10px;padding:11px 13px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cobalt);outline-offset:0}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

/* nav bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);margin-bottom:12px}
.appname{font-weight:600;font-size:1.05rem}
.navr{display:flex;gap:8px;align-items:center}
.todaychip{display:flex;align-items:center;gap:6px;background:var(--surface);border:0;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.mebtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--cobalt-soft);color:var(--cobalt);font-weight:700;cursor:pointer;font-size:.9rem}

/* cards */
.panel{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;background:var(--cobalt-soft);color:var(--cobalt);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px;font-size:1rem}
.btn:active{opacity:.7}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn.good{background:var(--nopal-soft);color:var(--nopal)}
.btn.mid{background:var(--marigold-soft);color:var(--marigold)}
.btn.bad{background:var(--chile-soft);color:var(--chile)}
.btn.ghost{background:transparent;color:var(--cobalt);padding-inline:8px}
.btn:disabled{opacity:.4;cursor:default}
.grow{flex:1}

/* today */
.hero{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap}
.ringbox{position:relative;width:116px;height:116px;flex:none}
.ringbox .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox b{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ringbox span{font-size:.75rem;color:var(--muted)}
.hero-side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.wd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:600;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wd i.part{background:var(--cobalt-soft);color:var(--cobalt)}
.wd i.full{background:var(--cobalt);color:var(--on-cobalt)}
.wd.today{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:0}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.err b{color:var(--chile)}.stat.ok b{color:var(--nopal)}.stat.due b{color:var(--marigold)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer;min-height:34px;font-weight:500}
.chip.on{background:var(--cobalt);color:var(--on-cobalt)}
.wchip{border-radius:8px;padding:4px 10px;font-size:.92rem;background:var(--sunk)}
.wchip.err{background:var(--chile-soft);color:var(--chile)}
.pill{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.new{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.learn{background:var(--marigold-soft);color:var(--marigold)}
.pill.ok{background:var(--nopal-soft);color:var(--nopal)}
.pill.err{background:var(--chile-soft);color:var(--chile)}
.tchip{font-size:.78rem;color:var(--muted);white-space:nowrap}
.heat{display:inline-flex;gap:2px;vertical-align:middle}
.heat i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.heat i.on{background:var(--chile)}

/* lists */
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wmain{min-width:0}
.wmain b{display:block;font-size:1rem;font-weight:600}
.wmain span{font-size:.86rem;color:var(--muted)}
.x{border:0;background:none;color:var(--cobalt);font-size:.88rem;cursor:pointer;padding:6px;min-height:36px}
.x.arm{color:var(--chile);font-weight:600}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
@media (max-width:460px){.formgrid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:500}

/* practice */
.modes{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.mode{text-align:left;background:transparent;border:0;border-bottom:.5px solid var(--line);padding:14px 40px 14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.mode:last-child{border-bottom:0}
.mode::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:translateY(-50%) rotate(45deg);opacity:.6}
.mode:active{background:var(--sunk)}
.mode .lv{font-size:.75rem;font-weight:600;color:var(--cobalt)}
.mode h3{font-size:1.02rem}
.mode p{font-size:.86rem;color:var(--muted)}
.mode.lock{opacity:.45}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:240px}
.big{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
.prompt-zh{font-size:1.35rem;font-weight:600}
.ex{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.96rem}
.ex em{font-style:normal;color:var(--muted);display:block;font-size:.86rem}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--nopal-soft)}
.fb.no{background:var(--chile-soft)}
.fb.ok b.h{color:var(--nopal)}.fb.no b.h{color:var(--chile)}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.done{align-items:center;text-align:center}
.done b.n{font-family:var(--f-display);font-size:3rem;font-weight:700;color:var(--cobalt)}
.thinking{color:var(--muted);font-size:.9rem}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"..."}}

/* chat */
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:84%;border-radius:18px;padding:9px 14px;font-size:1rem;overflow-wrap:anywhere}
.msg.them{background:var(--sunk);align-self:flex-start}
.msg.me{background:var(--cobalt);color:var(--on-cobalt);align-self:flex-end}
.msg details{margin-top:6px;font-size:.86rem;color:var(--muted)}
.msg summary{cursor:pointer}
.fix{align-self:flex-end;max-width:88%;background:var(--marigold-soft);border-radius:14px;padding:8px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.okmark{align-self:flex-end;font-size:.8rem;color:var(--nopal);font-weight:600}
.targets{font-size:.88rem}
.chatin{display:flex;gap:8px;align-items:flex-end}
.chatin textarea{min-height:46px;max-height:140px;resize:vertical;border-radius:22px;padding:11px 16px}

/* lessons */
.pack summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pack summary::-webkit-details-marker{display:none}
.pack summary h2::after{content:" ›";color:var(--muted);display:inline-block;transition:transform .2s}
.pack[open] summary h2::after{transform:rotate(90deg)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:.5px solid var(--line);align-items:center}
.plist li:last-child{border-bottom:0}
.plist small{color:var(--muted);grid-column:1/2;font-size:.84rem}
.rule{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.94rem}
.rule b{color:var(--ink)}
.warn{background:var(--chile-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}

/* week */
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.94rem}
.cmp th,.cmp td{padding:9px 6px;text-align:right;border-bottom:.5px solid var(--line)}
.cmp tr:last-child td{border-bottom:0}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-size:.78rem;color:var(--muted);font-weight:500}
.up{color:var(--nopal);font-weight:600}.down{color:var(--chile);font-weight:600}.flat{color:var(--muted)}
.chart{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.report{display:flex;flex-direction:column;gap:8px}
.lvl{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--cobalt);line-height:1}
.report ul{margin:0;padding-left:1.2em}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-top:6px}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 4px;cursor:pointer;color:var(--muted);min-height:48px}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:.66rem;font-weight:500}
.tab.on{color:var(--cobalt)}
.tab.on svg{stroke-width:2.2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.92rem;z-index:9;max-width:calc(100% - 32px)}
.note{font-size:.84rem;color:var(--muted)}
.say{border:0;background:var(--cobalt-soft);color:var(--cobalt);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;cursor:pointer;vertical-align:middle;min-height:28px}
.msg.them .say{background:var(--surface)}
.mic{border:0;background:var(--chile-soft);color:var(--chile);border-radius:22px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:46px;white-space:nowrap}
.mic.on{background:var(--chile);color:#fff}
.voicebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.help{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.diary-prompt{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.diary-prompt b{font-size:1.05rem}
.entry{border-top:.5px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.entry:first-child{border-top:0;padding-top:0}
.call{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0 4px}
.orb{width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#fff;background:var(--muted);position:relative}
.orb.listen{background:var(--chile)}.orb.speak{background:var(--cobalt)}.orb.think{background:var(--marigold)}.orb.type{background:var(--nopal)}
.orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid currentColor;opacity:0}
.orb.listen::after,.orb.speak::after{color:inherit;border-color:var(--chile);animation:ring 1.4s ease-out infinite}
.orb.speak::after{border-color:var(--cobalt)}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.orb::after{animation:none!important}}
.cap{font-size:1.1rem;font-weight:500;max-width:30em}
.tok{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border-radius:12px;background:var(--sunk)}
.tok button{border:0;border-radius:10px;padding:8px 12px;font-size:1rem;background:var(--surface);cursor:pointer;min-height:40px}
.tok.ans button{background:var(--cobalt);color:var(--on-cobalt)}
.listen-row{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.listen-row a{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;min-height:32px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 4px;font-size:.9rem;font-weight:500;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
</style>

<script>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const clean=s=>String(s||'').toLowerCase().replace(/[¿?¡!.,;:"'()—–\-]/g,' ').replace(/\s+/g,' ').trim();
const core=s=>clean(s).replace(/^(el|la|los|las|un|una)\s+/,'');
const uid=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function check(input,target){
  const a=clean(input);if(!a)return{ok:false};
  const vs=target.split('/').map(s=>s.trim()).filter(Boolean);
  for(const v of vs){if(a===clean(v))return{ok:true}}
  for(const v of vs){if(core(a)===core(v))return{ok:true,note:'冠詞（el / la）要注意'}}
  for(const v of vs){if(strip(core(a))===strip(core(v)))return{ok:true,note:'對了，但重音或 ñ 要寫對：'+v}}
  return{ok:false};
}

function apiSample(){
  async function call(input,opts){opts=opts||{};const k=getKey();if(!k)throw{code:'no_key'};
    const msgs=[];(typeof input==='string'?[{role:'user',content:input}]:input).forEach(m=>{const l=msgs[msgs.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else msgs.push({role:m.role,content:String(m.content)})});
    const model=opts.modelTier==='quick'?'claude-haiku-5-5':'claude-sonnet-5-5';
    let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1800,messages:msgs})})}catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
    if(r.status===401||r.status===403)throw{code:'bad_key'};if(r.status===429)throw{code:'rate_limited'};if(r.status===402||r.status===400){let j={};try{j=await r.json()}catch(e){}throw{code:/credit|balance/i.test(JSON.stringify(j))?'no_credit':'upstream_error'}}

  const f=(i,o)=>call(i,o);

  return f}

function vSemana(){const wk=weekStart(dkey()),cur=sumRange(wk,7),prev=sumRange(addDays(wk,-7),7),dayN=(parse(dkey())-parse(wk))/864e5+1;
  const row=(label,a,b,fmt=v=>v,unit='')=>{const d=a-b,cls=d>0?'up':d<0?'down':'flat';return `<tr><td>${label}</td><td>${fmt(b)}${unit}</td><td><b>${fmt(a)}${unit}</b></td><td class="${cls}">${d>0?'+':''}${fmt(d)}${unit}</td></tr>`};
  const accC=pct(cur.right,cur.right+cur.wrong+cur.unsure),accP=pct(prev.right,prev.right+prev.wrong+prev.unsure);
  const rep=S.log.reports?.[wk]||S.log.reports?.[addDays(wk,-7)];
  const better=[cur.sec>prev.sec,accC>accP,cur.mastered>prev.mastered].filter(Boolean).length;
  return `<section class="panel"><p class="eyebrow">SEMANA · ${wk.slice(5).replace('-','/')} 起（第 ${dayN} 天）</p>
    <h1>${cur.items+prev.items===0?'還沒有練習紀錄':better>=2?'比上週的自己更好':better===1?'有一項在進步':'這週加把勁'}</h1>
    <div style="overflow-x:auto"><table class="cmp"><thead><tr><th></th><th>上週</th><th>本週</th><th>差距</th></tr></thead><tbody>
    ${row('練習時間',Math.round(cur.sec/60),Math.round(prev.sec/60),v=>v,' 分')}
    ${row('達標天數（≥10 分）',cur.active,prev.active)}
    ${row('練習題數',cur.items,prev.items)}
    ${row('正確率',accC,accP,v=>v,'%')}
    ${row('新單字',cur.newW,prev.newW)}
    ${row('熟悉的字',cur.mastered,prev.mastered)}
    ${row('答錯次數',cur.wrong,prev.wrong)}
    ${row('日記天數',cur.diary,prev.diary)}
    </tbody></table></div>
    ${cur.miss.length?`<div><p class="note">本週錯最多的字</p><div class="chips">${topMiss(cur.miss).map(w=>`<span class="wchip err">${esc(w)}</span>`).join('')}</div></div>`:''}
  </section>
  ${mindmap()}
  <section class="panel"><h2>最近 14 天練習分鐘</h2><div class="chart">${bars14()}</div><p class="note">虛線是每日 10 分鐘目標，藍色長條代表那天達標。</p></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>AI 程度分析</h2><button class="btn primary" data-act="weekai" ${aiOK()?'':'disabled'}>${S.log.reports?.[wk]?'重新分析本週':'分析本週'}</button></div>
    <div id="repbox">${rep?repHTML(rep):`<p class="muted">按下分析，Claude 會比較你這週和上週的數字、錯題和對話糾錯，估計目前程度並給下週三個重點。${aiOK()?'':'（${aiNeed()}）'}</p>`}</div></section>`}
function topMiss(arr){const c={};arr.forEach(w=>c[w]=(c[w]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(e=>e[0])}
function sumRange(start,n){const o={sec:0,right:0,wrong:0,unsure:0,items:0,newW:0,mastered:0,active:0,diary:0,miss:[],fixes:[]};
  for(let i=0;i<n;i++){const d=S.log.days[addDays(start,i)];if(!d)continue;for(const f of['sec','right','wrong','unsure','items','newW'])o[f]+=d[f]||0;if((d.sec||0)>=600)o.active++;if(d.diary)o.diary++;o.mastered=Math.max(o.mastered,d.mastered||0);o.miss.push(...(d.miss||[]));o.fixes.push(...(d.fixes||[]))}return o}
function bars14(){const end=dkey(),days=[...Array(14)].map((_,i)=>addDays(end,i-13)),vals=days.map(k=>Math.round((S.log.days[k]?.sec||0)/60)),mx=Math.max(15,...vals),top=Math.ceil(mx/5)*5;

    const reply=String(r.reply||'').trim()||'¿Mande? ¿Me lo repites?';
    me.turns.push({role:'assistant',content:JSON.stringify({reply})});
    const lu=[...me.msgs].reverse().find(m=>m.who==='me'&&!m.graded);
    if(lu){lu.graded=true;const t=today();t.items++;
      const fixed=String(r.corrected||'').trim();
      if(fixed&&clean(fixed)!==clean(lu.text)){lu.fix={corrected:fixed,note:String(r.note_zh||'')};t.wrong++;t.fixes.push(`${lu.text} → ${fixed}`);if(t.fixes.length>30)t.fixes.shift()}else{lu.ok=true;t.right++}

function callListen(){const c=CH&&CH.call;if(!c||!c.on||CH.busy||REC)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||c.noMic){c.noMic=true;c.state='type';paintCall();const el=$('#chatin');if(el)el.focus();return}
  let r;try{r=new SR()}catch(e){c.noMic=true;callListen();return}
  REC=r;r.lang='es-MX';r.interimResults=true;r.continuous=false;let txt='';c.state='listen';c.cap='';paintCall();
  r.onresult=e=>{txt='';for(const x of e.results)txt+=x[0].transcript;c.cap=txt;paintCall()};
  r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))c.noMic=true};
  r.onend=()=>{REC=null;if(!CH||CH.call!==c||!c.on)return;const t=txt.trim();
    if(t){c.miss=0;c.cap='';CH.msgs.push({who:'me',text:t});CH.turns.push({role:'user',content:t});c.state='think';chatCall();return}
    if(c.noMic){callListen();return}
    c.miss=(c.miss||0)+1;if(c.miss<2){callListen();return}c.state='idle';paintCall()};
  try{r.start()}catch(e){c.noMic=true;callListen()}}
function callStart(){if(!CH)return;CH.call={on:true,state:'idle',cap:'',miss:0,sub:true};render();callListen()}
function callEnd(){const c=CH&&CH.call;if(c)c.on=false;try{REC&&REC.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}if(CH)CH.call=null;render()}

/* shadowing (跟讀) */
function lcsMark(target,said){const T=target.split(/\s+/).filter(Boolean),tn=T.map(x=>strip(clean(x))),un=strip(clean(said)).split(' ').filter(Boolean),n=tn.length,m=un.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=tn[i]&&tn[i]===un[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(tn[i]&&tn[i]===un[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const valid=tn.filter(Boolean).length,hit=ok.filter((v,k)=>v&&tn[k]).length;
  return{T,ok:ok.map((v,k)=>v||!tn[k]),score:valid?Math.round(hit*100/valid):0}}

function exportCode(){const d={v:1,at:new Date().toISOString(),me:S.me||{},words:S.words,diary:S.diary,log:S.log};return 'ORALE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function importCode(code){const raw=code.replace(/\s+/g,'').replace(/^ORALE1:/,'');const d=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!d||d.v!==1)throw 0;const n={w:0,d:0,days:0};
  const byEs={};Object.values(S.words).forEach(w=>byEs[clean(w.es)]=w);
  Object.values(d.words||{}).forEach(w=>{if(!w||!w.es)return;const cur=byEs[clean(w.es)];if(!cur){saveWord(Object.assign(newWord(w),w));n.w++}else if((w.seen||0)>(cur.seen||0))saveWord(Object.assign({},w,{id:cur.id}))});
  Object.entries(d.diary||{}).forEach(([k,e])=>{const cur=S.diary[k];if(!cur||(!cur.corrected&&e.corrected)||(e.text||'').length>(cur.text||'').length){saveDiary(Object.assign({},e,{date:k}));if(!cur)n.d++}});
  const L=d.log||{};Object.entries(L.days||{}).forEach(([k,v])=>{const cur=S.log.days[k];if(v&&(v.sec||v.items||v.diary))n.days++;if(!cur){S.log.days[k]=v;return}
    ['sec','right','wrong','unsure','items','newW','mastered','diary'].forEach(f=>cur[f]=Math.max(cur[f]||0,v[f]||0));['miss','fixes'].forEach(f=>cur[f]=[...new Set([...(cur[f]||[]),...(v[f]||[])])].slice(-40))});
  S.log.reports=Object.assign({},L.reports||{},S.log.reports||{});
  const mi=Object.assign({},S.log.missions||{});Object.entries(L.missions||{}).forEach(([k,v])=>{if(!mi[k]||(v.stars||0)>(mi[k].stars||0))mi[k]=v});S.log.missions=mi;
  if((!S.me||!S.me.name)&&d.me&&d.me.name){S.me=d.me;try{localStorage.setItem('orale-me',JSON.stringify(S.me))}catch(e){}if(S.profRef)S.profRef.update({me:S.me}).catch(()=>{})}
  saveLocal();scheduleFlush(500);return n}

  if(!act.length)tips.splice(0,tips.length,'還沒有單字資料。先到「課程」加入一個主題，心智圖就會長出來。');
  return `<section class="panel"><h2>學習方向心智圖</h2><p class="note">圓圈越大＝單字越多；數字＝熟悉度。綠色已熟、藍色進行中、橘色剛開始、紅色錯題多、虛線還沒開始。點圓圈直接練那個主題。</p>

let VOICE=null;
const VS=(()=>{try{return JSON.parse(localStorage.getItem('orale-voice')||'null')||{}}catch(e){return{}}})();
if(!VS.rate)VS.rate=.8;
function saveVS(){try{localStorage.setItem('orale-voice',JSON.stringify(VS))}catch(e){}}
const LANG=v=>v.lang.replace('_','-').toLowerCase();
function esVoices(){try{return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}catch(e){return[]}}
function voiceScore(v){const l=LANG(v),n=v.name;let s=0;
  if(l==='es-mx')s+=6;else if(l==='es-us'||l==='es-419')s+=4;else if(l==='es-es')s-=3;else s+=2;
  if(/natural|neural|online|premium|enhanced|mejorad/i.test(n))s+=4;
  if(/paulina|dalia|jorge|google/i.test(n))s+=2;
  if(/compact|eloquence|espeak/i.test(n))s-=4;
  if(v.localService===false)s+=1;return s}
function pickVoice(){const vs=esVoices();if(!vs.length){VOICE=null;return}
  VOICE=(VS.name&&vs.find(v=>v.name===VS.name))||[...vs].sort((a,b)=>voiceScore(b)-voiceScore(a))[0];fillVoiceSel()}
try{if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function fillVoiceSel(){const sel=document.getElementById('voicesel');if(!sel)return;const vs=esVoices().sort((a,b)=>voiceScore(b)-voiceScore(a));
  sel.innerHTML=vs.length?vs.map(v=>`<option value="${esc(v.name)}" ${VOICE&&v.name===VOICE.name?'selected':''}>${esc(v.name)}（${esc(v.lang)}）${LANG(v)==='es-es'?'・西班牙腔':''}</option>`).join(''):'<option>這台裝置沒有西班牙文語音</option>'}
// make text sound natural: drop emoji/markdown, read sentence by sentence with small pauses
function speechText(t){return String(t||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/[*_~#`>]/g,'').replace(/\([^)]*\)/g,'').replace(/\s*—\s*/g,', ').replace(/\s+/g,' ').trim()}
function speak(t,rate,onend){let done=false;const fin=()=>{if(!done){done=true;onend&&onend()}};
  try{if(!('speechSynthesis' in window)){if(!onend)toast('這台裝置不支援朗讀');fin();return}if(!VOICE)pickVoice();speechSynthesis.cancel();
  const text=speechText(t);if(!text){fin();return}
  const parts=text.match(/[^.!?…]+[.!?…]*/g)||[text],r=rate?rate*(VS.rate/.8):VS.rate;
  parts.map(x=>x.trim()).filter(Boolean).forEach((p,i,arr)=>{const u=new SpeechSynthesisUtterance(p);u.lang=VOICE?VOICE.lang:'es-MX';if(VOICE)u.voice=VOICE;u.rate=Math.max(.5,Math.min(1.2,r));u.pitch=1;
    if(i===arr.length-1){u.onend=fin;u.onerror=fin}speechSynthesis.speak(u)});
  if(onend)setTimeout(fin,Math.max(5000,text.length*150/r))}catch(e){fin()}}

 calltap:()=>{const c=CH&&CH.call;if(!c)return;if(c.state==='speak'){try{speechSynthesis.cancel()}catch(e){}return}if(c.state==='listen'){try{REC&&REC.stop()}catch(e){}return}if(c.state==='type'){const el=$('#chatin');if(el)el.focus();return}if(c.state==='idle'){c.miss=0;callListen()}},

 keydel:()=>{try{localStorage.removeItem('orale-key')}catch(e){}S.sample=null;toast('已移除金鑰');render()},

 vrateq:()=>{const order=[.65,.8,.92,1.05];const i=order.findIndex(v=>Math.abs(v-VS.rate)<.01);VS.rate=order[(i+1)%order.length];saveVS();const b=document.querySelector('[data-act=vrateq]');if(b)b.textContent='語速：'+rateLabel();},
 melv:b=>{S.me=Object.assign({},S.me,{level:b.dataset.l});document.querySelectorAll('[data-act=melv]').forEach(x=>x.classList.toggle('on',x===b))},
 mesave:()=>{saveMe();toast('已儲存');go('hoy')},
 mmgo:b=>{S.ptheme=b.dataset.t;const n=pool(b.dataset.t).length;if(!n){go('lecciones');toast('先加入「'+THEMES[b.dataset.t]+'」的單字');return}startMode(statsW().err&&pool(b.dataset.t).some(w=>w.inErr)?'trans':'flash')},
 autosay:()=>{S.autoSay=!S.autoSay;try{localStorage.setItem('orale-autosay',S.autoSay?'1':'0')}catch(e){}if(!S.autoSay)try{speechSynthesis.cancel()}catch(e){}const b=document.querySelector('[data-act=autosay]');if(b){b.classList.toggle('on',S.autoSay);b.textContent='自動朗讀：'+(S.autoSay?'開':'關')}},
 mic:b=>listen(b),

 dword:b=>{const e=S.diary[b.dataset.d];const w=e?.words?.[+b.dataset.i];if(!w)return;const n=addWords([{es:w.es,zh:w.zh,theme:'general',ex:e.corrected||'',exZh:'出自 '+b.dataset.d+' 的日記'}]);toast(n?`加入「${w.es}」`:'這個字已經在單字庫裡');b.remove()},
 askcheck:()=>{const v=$('#ans').value.trim();if(!v)return;P.fb={you:v};askGrade()},
 regrade:()=>{P.fb={you:P.fb.you};askGrade()},
 pcheck:()=>{const v=$('#ans').value;if(v.trim())pastGrade(v)},
 pskip:()=>pastGrade(''),
 chat:b=>{if(!aiOK()){toast(aiNeed());return}chatStart(b.dataset.t)},
 send:()=>chatSend(),
 chatretry:()=>chatCall(),
 fixsave:b=>{const m=CH.msgs[+b.dataset.i];if(!m||!m.fix)return;const w=newWord({es:m.fix.corrected,zh:m.fix.note||('對話糾錯：'+m.text),en:'',theme:CH.topic,ex:m.fix.corrected,exZh:'你原本寫：'+m.text});w.inErr=true;saveWord(w);today().newW++;scheduleFlush(1500);m.fix.saved=true;paintChat();toast('已加入錯題本')},
 addone:()=>{const es=$('#n-es').value.trim(),zh=$('#n-zh').value.trim();if(!es||!zh){toast('西文和中文都要填，或按「AI 補完」');return}
   const n=addWords([{es,zh,en:$('#n-en').value.trim(),theme:$('#n-th').value,ex:$('#n-ex').value.trim()}]);toast(n?`加入「${es}」`:'這個字已經在單字庫裡');if(n)['n-es','n-zh','n-en','n-ex'].forEach(i=>$('#'+i).value='');paintList()},
 aifill1:async b=>{const es=$('#n-es').value.trim(),zh=$('#n-zh').value.trim();if(!es&&!zh){toast('先填西文或中文其中一個');return}b.disabled=true;b.textContent='Claude 補完中…';
   try{const r=await aiWords([es&&zh?`${es} = ${zh}`:es||zh]);const o=Array.isArray(r)?r[0]:r;if(o){$('#n-es').value=o.es||es;$('#n-zh').value=o.zh||zh;$('#n-en').value=o.en||'';$('#n-ex').value=o.ex||'';if(THEMES[o.theme])$('#n-th').value=o.theme;S._exZh=o.exZh;S._heat=o.heat;toast('補好了，確認後按「加入」')}}
   catch(e){toast(aiErr(e))}finally{b.disabled=false;b.textContent='AI 補完中英文與例句'}},
 aibulk:async b=>{const lines=$('#bulk').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,40);if(!lines.length){toast('先貼上單字，每行一個');return}
   b.disabled=true;$('#bulkmsg').innerHTML='<span class="thinking">Claude 正在整理 '+lines.length+' 個字</span>';
   try{const r=await aiWords(lines);const n=addWords((Array.isArray(r)?r:[]).map(o=>({es:String(o.es||'').trim(),zh:String(o.zh||''),en:String(o.en||''),theme:o.theme,ex:String(o.ex||''),exZh:String(o.exZh||''),heat:Math.max(0,Math.min(3,Number(o.heat)||0))})));
     $('#bulkmsg').textContent=`加入 ${n} 個新字${lines.length>n?`（${lines.length-n} 個重複或無法辨識）`:''}。`;$('#bulk').value='';paintList()}
   catch(e){$('#bulkmsg').textContent=aiErr(e)}finally{b.disabled=false}},
 plainbulk:()=>{const lines=$('#bulk').value.split('\n').map(s=>s.trim()).filter(Boolean);const items=[];const bad=[];
   lines.forEach(l=>{const m=l.split(/\s*[=＝]\s*/);if(m.length>=2&&m[0]&&m[1])items.push({es:m[0],zh:m.slice(1).join(' = '),theme:'general'});else bad.push(l)});
   const n=addWords(items);$('#bulkmsg').textContent=`加入 ${n} 個。`+(bad.length?`這幾行沒有「=」所以跳過：${bad.join('、')}`:'');if(!bad.length)$('#bulk').value='';paintList()},
 mtab:b=>{S.mtab=b.dataset.t;S.song=null;keepOpen()},
 singpick:b=>{S.singIdx=+b.dataset.i;keepOpen()},
 song:async b=>{const[title,artist,note]=SONGS[b.dataset.k][+b.dataset.i];
   if(!aiOK()){S.song={title,artist,r:offlineSong(title,artist,note,b.dataset.k)};$('#songbox').innerHTML=songHTML();$('#songbox').scrollIntoView({behavior:'smooth',block:'nearest'});return}
   S.song={title,artist,loading:true};$('#songbox').innerHTML=songHTML();$('#songbox').scrollIntoView({behavior:'smooth',block:'nearest'});
   try{const r=await S.sample.json(`You are a Spanish teacher who uses music. ${learner()} ${MX}
Song: "${title}" by ${artist}.
Explain this song to help the learner understand and sing it. IMPORTANT: do not quote or reproduce any lyrics lines; describe the content in your own words. Single words or short slang terms (max 3 words each) are fine.
Reply with only JSON: {"about_zh":"用繁體中文 2–3 句說這首歌在講什麼（自己的話，不引用歌詞）","accent_zh":"歌手口音與唱法特色、學唱時要注意的發音（繁體中文）","words":[8 items {"es":"word or slang from the song's vocabulary","zh":"繁體中文","en":"English","note":"用法或文化說明，若是波多黎各/多明尼加用語請附墨西哥說法"}],"mx_zh":"這首歌的用語跟墨西哥說法差在哪（繁體中文 1–2 句）","sing_tips":["3 個具體練唱步驟（繁體中文）"]}`,{modelTier:'default',cache:{gcTime:86400000}});
     if(S.song?.title!==title)return;S.song={title,artist,r:{about_zh:String(r.about_zh||''),accent_zh:String(r.accent_zh||''),mx_zh:String(r.mx_zh||''),words:(r.words||[]).slice(0,10).map(w=>({es:String(w.es||''),zh:String(w.zh||''),en:String(w.en||''),note:String(w.note||'')})),sing_tips:(r.sing_tips||[]).map(String).slice(0,4)}}}
   catch(e){if(S.song?.title!==title)return;S.song={title,artist,err:aiErr(e)}}
   const box=$('#songbox');if(box)box.innerHTML=songHTML()},
 songadd:()=>{const s=S.song;if(!s?.r)return;const n=addWords(s.r.words.filter(w=>w.es).map(w=>({es:w.es,zh:w.zh,en:w.en,theme:'musica',ex:'',exZh:`出自〈${s.title}〉${w.note?'：'+w.note:''}`})));toast(n?`加入 ${n} 個字（主題：音樂）`:'這些字都已經在單字庫裡')},
 ftheme:b=>{S.f.theme=b.dataset.t;render()},
 fst:b=>{S.f.st=b.dataset.s;render()},
 del:b=>{if(!b.classList.contains('arm')){document.querySelectorAll('.x.arm').forEach(x=>{x.classList.remove('arm');x.textContent='刪除'});b.classList.add('arm');b.textContent='確定刪除？';return}removeWord(b.dataset.id);paintList()},
 addp:b=>{const p=PACKS[b.dataset.k][+b.dataset.i];addWords([{es:p[0],zh:p[1],en:p[2],ex:p[3],exZh:p[4],heat:p[5]||0,theme:b.dataset.k}]);keepOpen()},
 addpack:b=>{const k=b.dataset.k;const n=addWords(PACKS[k].map(p=>({es:p[0],zh:p[1],en:p[2],ex:p[3],exZh:p[4],heat:p[5]||0,theme:k})));toast(`加入 ${n} 個「${THEMES[k]}」單字`);keepOpen()},
 weekai:async b=>{const wk=weekStart(dkey()),cur=sumRange(wk,7),prev=sumRange(addDays(wk,-7),7),s=statsW();b.disabled=true;$('#repbox').innerHTML='<p class="thinking">Claude 正在分析這週</p>';
   const pick=o=>({minutes:Math.round(o.sec/60),days_10min:o.active,diary_days:o.diary,items:o.items,right:o.right,wrong:o.wrong,unsure:o.unsure,new_words:o.newW,mastered_words:o.mastered});
   try{const r=await S.sample.json(`你是墨西哥西班牙語老師，幫學生做每週程度分析。${learner()}
本週（${wk} 起）：${JSON.stringify(pick(cur))}
上週：${JSON.stringify(pick(prev))}
目前單字庫：共 ${s.total} 個，熟悉 ${s.mast}，錯題 ${s.err}。
本週常錯的字：${topMiss(cur.miss).join(', ')||'無'}
本週造句與對話的糾錯紀錄（原句 → 修正）：
${cur.fixes.slice(-15).join('\n')||'無'}
請根據這些資料估計 CEFR 程度、判斷跟上週比是進步、持平還是退步（看練習量、正確率、熟悉字數、錯誤類型），用繁體中文、具體、直接。
只回覆 JSON：{"level":"A1|A1+|A2|A2+|B1|B1+|B2","trend":"進步|持平|退步","summary":"2–3 句總結，要提到具體數字或錯誤類型","strengths":["1–2 點"],"focus":["下週 3 個具體練習重點"],"challenge":"一個跟旅行、巴恰塔或潛水相關的墨西哥口語小挑戰（附西文例句）"}`,{modelTier:'default',cache:false});
     S.log.reports=S.log.reports||{};S.log.reports[wk]={level:String(r.level||''),trend:String(r.trend||''),summary:String(r.summary||''),strengths:(r.strengths||[]).map(String).slice(0,3),focus:(r.focus||[]).map(String).slice(0,4),challenge:String(r.challenge||''),at:dkey()};scheduleFlush(300);render()}
   catch(e){$('#repbox').innerHTML=`<p class="note">${esc(aiErr(e))}</p>`;b.disabled=false}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('change',e=>{if(e.target.id==='voicesel'){VS.name=e.target.value;saveVS();pickVoice();speak('Hola, así suena mi voz. ¿Te gusta?')}});
document.addEventListener('input',e=>{if(e.target.id==='wq'){S.f.q=e.target.value;paintList()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;
  if(id==='chatin'&&!e.shiftKey){e.preventDefault();chatSend();return}
  if(id==='ans'&&e.target.tagName==='INPUT'){e.preventDefault();if(P.mode==='past')ACT.pcheck();else ACT.tcheck();return}
  if(id==='ans'&&e.target.tagName==='TEXTAREA'&&!e.shiftKey){e.preventDefault();P.mode==='shadow'?shadowGrade():P.mode==='sent'?ACT.scheck():P.mode==='coach'?coachGrade():ACT.askcheck();return}
  if(/^drill\d$/.test(id)){e.preventDefault();drillCheck(+id.slice(5));return}
  if(id==='nextbtn'){e.preventDefault();next()}});
// keep exZh/heat from single AI fill
const _addone=ACT.addone;ACT.addone=()=>{const es=$('#n-es').value.trim(),zh=$('#n-zh').value.trim();if(es&&zh&&S._exZh!==undefined){const n=addWords([{es,zh,en:$('#n-en').value.trim(),theme:$('#n-th').value,ex:$('#n-ex').value.trim(),exZh:S._exZh||'',heat:Math.max(0,Math.min(3,Number(S._heat)||0))}]);S._exZh=undefined;S._heat=undefined;toast(n?`加入「${es}」`:'這個字已經在單字庫裡');if(n)['n-es','n-zh','n-en','n-ex'].forEach(i=>$('#'+i).value='');paintList();return}_addone()};

/* ---------- boot ---------- */
async function boot(){loadLocal();render();
  const C=window.claude;if(!C||typeof C.use!=='function'){S.standalone=true;if(getKey())S.sample=apiSample();render();return}
  const [db,user,sample]=await Promise.all([C.use('db'),C.use('user'),C.use('sample')].map(p=>Promise.resolve(p).catch(()=>null)));
  S.sample=sample||null;
  if(db&&user){let id=null;try{id=await user.id()}catch(e){}
    if(id){const profRef=db.doc(`data/users/${id}/profile`);
      try{const snap=await profRef.get();const d=snap.exists?JSON.parse(JSON.stringify(snap.data())):{};if(d.me&&Object.keys(d.me).length)S.me=d.me;else if(S.me&&S.me.name)d.me=S.me;d.lastOpen=dkey();await profRef.set(d);S.profRef=profRef}
      catch(e){render();return}
      S.cloud=true;wordsCol=profRef.collection('words');logRef=db.doc(`data/users/${id}/log`);diaryCol=db.doc(`data/users/${id}/profile`).collection('diary');
      diaryCol.onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=JSON.parse(JSON.stringify(d.data()))});if(q.empty&&!q.metadata.fromCache&&Object.keys(S.diary).length){Object.values(S.diary).forEach(saveDiary);return}S.diary=o;saveLocal();renderSoft()},()=>{});
      wordsCol.onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=JSON.parse(JSON.stringify(d.data()))});
        for(const k in wlatest)o[k]=wlatest[k];
        if(!migrated&&!q.metadata.fromCache){migrated=true;if(q.empty&&Object.keys(S.words).length){Object.values(S.words).forEach(saveWord);return}}
        S.words=o;saveLocal();renderSoft()},()=>{});
      logRef.onSnapshot(s=>{if(!s.exists||logDirty||logWriting)return;const d=JSON.parse(JSON.stringify(s.data()));S.log={days:d.days||{},reports:d.reports||{},missions:d.missions||{}};saveLocal();renderSoft()},()=>{});}}
  render()}
boot();
</script>
