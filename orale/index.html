<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="墨西哥西班牙文學習：單字、閃卡、錯題本、跟讀、情境任務、日記、台灣與墨西哥文化、巴恰塔音樂。免登入。">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Órale">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23007AFF'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='-apple-system,Helvetica,Arial' font-weight='700'%3E%C3%B3%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Órale Español</title>

<body>

<style>
/* Layout: iOS-style app — grouped gray background, white inset cards, large titles, translucent tab bar with line icons. Plain system type, one blue accent. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:#EEEEF0; --ink:#1D1D1F; --muted:#6E6E73; --line:#E3E3E8;
  --cobalt:#007AFF; --cobalt-soft:#E5F0FF; --on-cobalt:#FFFFFF;
  --marigold:#FF9500; --marigold-soft:#FFF2E0;
  --chile:#FF3B30; --chile-soft:#FFE9E7; --nopal:#34C759; --nopal-soft:#E5F8EA;
  --bar:rgba(242,242,247,.86);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Helvetica Neue","Noto Sans TC",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#F5F5F7; --muted:#98989F; --line:#2E2E31;
  --cobalt:#0A84FF; --cobalt-soft:#0A84FF26; --on-cobalt:#FFFFFF;
  --marigold:#FF9F0A; --marigold-soft:#FF9F0A24;
  --chile:#FF453A; --chile-soft:#FF453A24; --nopal:#30D158; --nopal-soft:#30D15824;
  --bar:rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#F5F5F7; --muted:#98989F; --line:#2E2E31;
  --cobalt:#0A84FF; --cobalt-soft:#0A84FF26; --on-cobalt:#FFFFFF;
  --marigold:#FF9F0A; --marigold-soft:#FF9F0A24;
  --chile:#FF453A; --chile-soft:#FF453A24; --nopal:#30D158; --nopal-soft:#30D15824;
  --bar:rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-family:var(--f-display);font-size:1.75rem;font-weight:700;line-height:1.2}
h2{font-size:1.1rem;font-weight:600;line-height:1.3}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--cobalt);text-decoration:none}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:17px;background:var(--sunk);border:0;border-radius:10px;padding:11px 13px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cobalt);outline-offset:0}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

/* nav bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);margin-bottom:12px}
.appname{font-weight:600;font-size:1.05rem}
.navr{display:flex;gap:8px;align-items:center}
.todaychip{display:flex;align-items:center;gap:6px;background:var(--surface);border:0;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.mebtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--cobalt-soft);color:var(--cobalt);font-weight:700;cursor:pointer;font-size:.9rem}

/* cards */
.panel{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;background:var(--cobalt-soft);color:var(--cobalt);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px;font-size:1rem}
.btn:active{opacity:.7}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn.good{background:var(--nopal-soft);color:var(--nopal)}
.btn.mid{background:var(--marigold-soft);color:var(--marigold)}
.btn.bad{background:var(--chile-soft);color:var(--chile)}
.btn.ghost{background:transparent;color:var(--cobalt);padding-inline:8px}
.btn:disabled{opacity:.4;cursor:default}
.grow{flex:1}

/* today */
.hero{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap}
.ringbox{position:relative;width:116px;height:116px;flex:none}
.ringbox .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox b{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ringbox span{font-size:.75rem;color:var(--muted)}
.hero-side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.wd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:600;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wd i.part{background:var(--cobalt-soft);color:var(--cobalt)}
.wd i.full{background:var(--cobalt);color:var(--on-cobalt)}
.wd.today{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:0}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.err b{color:var(--chile)}.stat.ok b{color:var(--nopal)}.stat.due b{color:var(--marigold)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer;min-height:34px;font-weight:500}
.chip.on{background:var(--cobalt);color:var(--on-cobalt)}
.wchip{border-radius:8px;padding:4px 10px;font-size:.92rem;background:var(--sunk)}
.wchip.err{background:var(--chile-soft);color:var(--chile)}
.pill{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.new{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.learn{background:var(--marigold-soft);color:var(--marigold)}
.pill.ok{background:var(--nopal-soft);color:var(--nopal)}
.pill.err{background:var(--chile-soft);color:var(--chile)}
.tchip{font-size:.78rem;color:var(--muted);white-space:nowrap}
.heat{display:inline-flex;gap:2px;vertical-align:middle}
.heat i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.heat i.on{background:var(--chile)}

/* lists */
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wmain{min-width:0}
.wmain b{display:block;font-size:1rem;font-weight:600}
.wmain span{font-size:.86rem;color:var(--muted)}
.x{border:0;background:none;color:var(--cobalt);font-size:.88rem;cursor:pointer;padding:6px;min-height:36px}
.x.arm{color:var(--chile);font-weight:600}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
@media (max-width:460px){.formgrid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:500}

/* practice */
.modes{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.mode{text-align:left;background:transparent;border:0;border-bottom:.5px solid var(--line);padding:14px 40px 14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.mode:last-child{border-bottom:0}
.mode::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:translateY(-50%) rotate(45deg);opacity:.6}
.mode:active{background:var(--sunk)}
.mode .lv{font-size:.75rem;font-weight:600;color:var(--cobalt)}
.mode h3{font-size:1.02rem}
.mode p{font-size:.86rem;color:var(--muted)}
.mode.lock{opacity:.45}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:240px}
.big{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
.prompt-zh{font-size:1.35rem;font-weight:600}
.ex{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.96rem}
.ex em{font-style:normal;color:var(--muted);display:block;font-size:.86rem}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--nopal-soft)}
.fb.no{background:var(--chile-soft)}
.fb.ok b.h{color:var(--nopal)}.fb.no b.h{color:var(--chile)}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.done{align-items:center;text-align:center}
.done b.n{font-family:var(--f-display);font-size:3rem;font-weight:700;color:var(--cobalt)}
.thinking{color:var(--muted);font-size:.9rem}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"..."}}

/* chat */
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:84%;border-radius:18px;padding:9px 14px;font-size:1rem;overflow-wrap:anywhere}
.msg.them{background:var(--sunk);align-self:flex-start}
.msg.me{background:var(--cobalt);color:var(--on-cobalt);align-self:flex-end}
.msg details{margin-top:6px;font-size:.86rem;color:var(--muted)}
.msg summary{cursor:pointer}
.fix{align-self:flex-end;max-width:88%;background:var(--marigold-soft);border-radius:14px;padding:8px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.okmark{align-self:flex-end;font-size:.8rem;color:var(--nopal);font-weight:600}
.targets{font-size:.88rem}
.chatin{display:flex;gap:8px;align-items:flex-end}
.chatin textarea{min-height:46px;max-height:140px;resize:vertical;border-radius:22px;padding:11px 16px}

/* lessons */
.pack summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pack summary::-webkit-details-marker{display:none}
.pack summary h2::after{content:" ›";color:var(--muted);display:inline-block;transition:transform .2s}
.pack[open] summary h2::after{transform:rotate(90deg)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:.5px solid var(--line);align-items:center}
.plist li:last-child{border-bottom:0}
.plist small{color:var(--muted);grid-column:1/2;font-size:.84rem}
.rule{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.94rem}
.rule b{color:var(--ink)}
.warn{background:var(--chile-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}

/* week */
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.94rem}
.cmp th,.cmp td{padding:9px 6px;text-align:right;border-bottom:.5px solid var(--line)}
.cmp tr:last-child td{border-bottom:0}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-size:.78rem;color:var(--muted);font-weight:500}
.up{color:var(--nopal);font-weight:600}.down{color:var(--chile);font-weight:600}.flat{color:var(--muted)}
.chart{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.report{display:flex;flex-direction:column;gap:8px}
.lvl{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--cobalt);line-height:1}
.report ul{margin:0;padding-left:1.2em}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-top:6px}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 4px;cursor:pointer;color:var(--muted);min-height:48px}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:.66rem;font-weight:500}
.tab.on{color:var(--cobalt)}
.tab.on svg{stroke-width:2.2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.92rem;z-index:9;max-width:calc(100% - 32px)}
.note{font-size:.84rem;color:var(--muted)}
.say{border:0;background:var(--cobalt-soft);color:var(--cobalt);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;cursor:pointer;vertical-align:middle;min-height:28px}
.msg.them .say{background:var(--surface)}
.mic{border:0;background:var(--chile-soft);color:var(--chile);border-radius:22px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:46px;white-space:nowrap}
.mic.on{background:var(--chile);color:#fff}
.voicebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.help{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.diary-prompt{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.diary-prompt b{font-size:1.05rem}
.entry{border-top:.5px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.entry:first-child{border-top:0;padding-top:0}
.call{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0 4px}
.orb{width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#fff;background:var(--muted);position:relative}
.orb.listen{background:var(--chile)}.orb.speak{background:var(--cobalt)}.orb.think{background:var(--marigold)}.orb.type{background:var(--nopal)}
.orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid currentColor;opacity:0}
.orb.listen::after,.orb.speak::after{color:inherit;border-color:var(--chile);animation:ring 1.4s ease-out infinite}
.orb.speak::after{border-color:var(--cobalt)}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.orb::after{animation:none!important}}
.cap{font-size:1.1rem;font-weight:500;max-width:30em}
.tok{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border-radius:12px;background:var(--sunk)}
.tok button{border:0;border-radius:10px;padding:8px 12px;font-size:1rem;background:var(--surface);cursor:pointer;min-height:40px}
.tok.ans button{background:var(--cobalt);color:var(--on-cobalt)}
.listen-row{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.listen-row a{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;min-height:32px}
.alarm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.alarm[hidden]{display:none!important}
.alarm .panel{max-width:360px;width:100%;text-align:center}
.lyl{padding:8px 10px;border-radius:10px;transition:background .2s}
.lyl.on{background:var(--cobalt-soft)}
.gapin{width:auto;display:inline-block;padding:4px 6px;font-size:1rem;margin:2px 0;max-width:100%}
.tl{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 16px;display:flex;flex-direction:column;gap:2px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--cobalt)}
.tl b.y{color:var(--cobalt);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 4px;font-size:.9rem;font-weight:500;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
</style>

<div class="wrap">
  <header class="top">
    <div class="appname">Órale 西語</div>
    <div class="navr"><button class="todaychip" data-act="go" data-v="hoy" aria-label="今日練習進度">
      <svg id="miniring" width="28" height="28" viewBox="0 0 36 36" aria-hidden="true"></svg>
      <span id="minitxt">0/10 分</span>
    </button><button class="mebtn" data-act="go" data-v="yo" aria-label="我的設定" id="mebtn">我</button></div>
  </header>
  <main id="main" class="stack"></main>
</div>
<nav class="tabs" aria-label="主選單"><div class="in">
  <button class="tab" data-act="go" data-v="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg><span>今日</span></button>

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dkey(d)};
const weekStart=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const pct=(a,b)=>b?Math.round(a*100/b):0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const clean=s=>String(s||'').toLowerCase().replace(/[¿?¡!.,;:"'()—–\-]/g,' ').replace(/\s+/g,' ').trim();
const core=s=>clean(s).replace(/^(el|la|los|las|un|una)\s+/,'');
const uid=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function check(input,target){
  const a=clean(input);if(!a)return{ok:false};
  const vs=target.split('/').map(s=>s.trim()).filter(Boolean);
  for(const v of vs){if(a===clean(v))return{ok:true}}
  for(const v of vs){if(core(a)===core(v))return{ok:true,note:'冠詞（el / la）要注意'}}
  for(const v of vs){if(strip(core(a))===strip(core(v)))return{ok:true,note:'對了，但重音或 ñ 要寫對：'+v}}
  return{ok:false};
}

const S={me:(()=>{try{return JSON.parse(localStorage.getItem('orale-me')||'null')||{}}catch(e){return{}}})(),cloud:false,autoSay:(()=>{try{return localStorage.getItem('orale-autosay')!=='0'}catch(e){return true}})(),diary:{},words:{},log:{days:{},reports:{}},sample:null,aiBlocked:false,view:'hoy',f:{q:'',theme:'all',st:'all'},ptheme:'all'};
const LS='orale-es-v1';
let diaryCol=null,wordsCol=null,logRef=null,logDirty=false,logWriting=false,migrated=false;
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.diary=j.diary||{};S.words=j.words||{};S.log=Object.assign({days:{},reports:{}},j.log||{})}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({words:S.words,log:S.log,diary:S.diary}))}catch(e){}}
const wq={},wlatest={};
function saveWord(w){S.words[w.id]=w;saveLocal();if(!wordsCol)return;wlatest[w.id]=w;if(wq[w.id])return;
  wq[w.id]=(async()=>{try{while(wlatest[w.id]){const d=wlatest[w.id];delete wlatest[w.id];await wordsCol.doc(d.id).set(JSON.parse(JSON.stringify(d)))}}catch(e){toast(e&&e.code==='quota_exceeded'?'單字庫已滿，請刪掉一些不用的字。':'同步沒成功，資料先存在這台裝置。')}finally{delete wq[w.id]}})()}
function removeWord(id){delete S.words[id];saveLocal();if(wordsCol)wordsCol.doc(id).delete().catch(()=>{})}
function today(){const k=dkey();const d=S.log.days[k]||(S.log.days[k]={});for(const[f,v]of Object.entries({sec:0,right:0,wrong:0,unsure:0,items:0,newW:0,mastered:0}))if(typeof d[f]!=='number')d[f]=v;if(!Array.isArray(d.miss))d.miss=[];if(!Array.isArray(d.fixes))d.fixes=[];return d}
let ft=null,flushAt=0;
function scheduleFlush(ms){logDirty=true;const t=Date.now()+ms;if(ft&&flushAt<=t)return;clearTimeout(ft);flushAt=t;ft=setTimeout(flushLog,ms)}
async function flushLog(){ft=null;flushAt=0;today().mastered=countMastered();saveLocal();
  if(!logRef){logDirty=false;return}
  if(logWriting){scheduleFlush(1500);return}
  logWriting=true;logDirty=false;
  try{await logRef.set(JSON.parse(JSON.stringify(S.log)))}catch(e){logDirty=true}finally{logWriting=false}}
function newWord(o){return{id:o.id||uid(),es:o.es,zh:o.zh||'',en:o.en||'',theme:THEMES[o.theme]?o.theme:'general',ex:o.ex||'',exZh:o.exZh||'',heat:o.heat||0,box:0,due:dkey(),seen:0,right:0,wrong:0,inErr:false,errOk:0,added:dkey()}}
function addWords(list){const have=new Set(Object.values(S.words).map(w=>clean(w.es)));let n=0;

function vSemana(){const wk=weekStart(dkey()),cur=sumRange(wk,7),prev=sumRange(addDays(wk,-7),7),dayN=(parse(dkey())-parse(wk))/864e5+1;

function topMiss(arr){const c={};arr.forEach(w=>c[w]=(c[w]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(e=>e[0])}
function sumRange(start,n){const o={sec:0,right:0,wrong:0,unsure:0,items:0,newW:0,mastered:0,active:0,diary:0,miss:[],fixes:[],cat:{}};
  for(let i=0;i<n;i++){const d=S.log.days[addDays(start,i)];if(!d)continue;for(const f of['sec','right','wrong','unsure','items','newW'])o[f]+=d[f]||0;if((d.sec||0)>=600)o.active++;if(d.diary)o.diary++;o.mastered=Math.max(o.mastered,d.mastered||0);o.miss.push(...(d.miss||[]));o.fixes.push(...(d.fixes||[]));for(const[c,v]of Object.entries(d.cat||{}))o.cat[c]=(o.cat[c]||0)+v}return o}
function bars14(){const end=dkey(),days=[...Array(14)].map((_,i)=>addDays(end,i-13)),vals=days.map(k=>Math.round((S.log.days[k]?.sec||0)/60)),mx=Math.max(15,...vals),top=Math.ceil(mx/5)*5;
  const W=360,H=160,L=28,R=6,T=10,B=24,bw=(W-L-R)/14,y=v=>T+(H-T-B)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 14 天每日練習分鐘">`;
  [0,10,top].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v===10?'stroke-dasharray="4 3" stroke="var(--marigold)"':''}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`});
  vals.forEach((v,i)=>{const x=L+i*bw+3,w=bw-6;if(v>0)s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(1,H-B-y(v))}" rx="3" fill="${v>=10?'var(--cobalt)':'var(--marigold)'}"/>`;
    const d=parse(days[i]);s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="${days[i]===end?'var(--ink)':'var(--muted)'}">${d.getDate()}</text>`});
  return s+'</svg>'}

function pool(theme){let ws=Object.values(S.words);if(theme&&theme!=='all')ws=ws.filter(w=>w.theme===theme);return ws}
function buildQueue(mode,theme){const t=dkey();let ws=pool(theme);
  if(mode==='err')return shuffle(ws.filter(w=>w.inErr)).slice(0,20).map(w=>w.id);
  if(mode==='ask')ws=ws.filter(w=>!/^.*\s=\s/.test(w.es));
  if(mode==='shadow'||mode==='sent')ws=ws.filter(w=>w.ex&&w.ex.split(' ').length>=3);
  if(mode==='build')ws=ws.filter(w=>w.ex&&w.ex.split(' ').length>=4&&w.ex.split(' ').length<=12);
  const err=shuffle(ws.filter(w=>w.inErr)),due=shuffle(ws.filter(w=>!w.inErr&&w.seen&&w.due<=t)),fresh=ws.filter(w=>!w.seen).sort((a,b)=>(a.added||'').localeCompare(b.added||'')),rest=shuffle(ws.filter(w=>!w.inErr&&w.seen&&w.due>t)).sort((a,b)=>(a.box||0)-(b.box||0));
  return[...err.slice(0,5),...due,...fresh,...rest].slice(0,mode==='ask'?8:15).map(w=>w.id)}

  if(mode==='coach'){P={active:true,mode:'coach',queue:shuffle(PATTERNS.map((_,i)=>i)).slice(0,6),total:6,done:0,right:0,wrong:0};S.view='practicar';next();return}
  if(mode==='past'){P={active:true,mode:'past',queue:shuffle(PAST.map((_,i)=>i)),total:PAST.length,done:0,right:0,wrong:0};S.view='practicar';next();return}
  const theme=mode==='err'?'all':S.ptheme,q=buildQueue(mode,theme);

  const qq=limit?q.slice(0,limit):q;P={active:true,mode,queue:qq,total:qq.length,done:0,right:0,wrong:0,daily:!!daily};S.view='practicar';next()}

function cloze(w){if(!w.ex)return null;const c=core(w.es.split('/')[0]);if(!c)return null;
  const plain=strip(w.ex),idx=plain.toLowerCase().search(new RegExp(strip(c).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'));if(idx<0)return null;return w.ex.slice(0,idx)+'_____'+w.ex.slice(idx+strip(c).length)}

async function askGrade(){const w=curW(),q=P.q,you=P.fb.you,id=P.cur;P.fb={loading:true,you};render();

function callListen(){const c=CH&&CH.call;if(!c||!c.on||CH.busy||REC)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* shadowing (跟讀) */
function lcsMark(target,said){const T=target.split(/\s+/).filter(Boolean),tn=T.map(x=>strip(clean(x))),un=strip(clean(said)).split(' ').filter(Boolean),n=tn.length,m=un.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=tn[i]&&tn[i]===un[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(tn[i]&&tn[i]===un[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const valid=tn.filter(Boolean).length,hit=ok.filter((v,k)=>v&&tn[k]).length;
  return{T,ok:ok.map((v,k)=>v||!tn[k]),score:valid?Math.round(hit*100/valid):0}}

Each line below is either a Spanish word/phrase, a Chinese or English meaning, or "Spanish = Chinese". For each line make one dictionary entry using the Mexican word and meaning (if the learner wrote Chinese/English, give the word a Mexican would actually use).
Lines:
${lines.map(l=>'- '+l).join('\n')}
Reply with only a JSON array, one object per line, in order: [{"es":"Spanish (nouns with el/la)","zh":"繁體中文意思","en":"English","theme":"one of viaje|bachata|buceo|chino|banco|calle|general","ex":"short natural Mexican Spanish example sentence","exZh":"例句的繁體中文翻譯","heat":0 (or 1–3 if it is slang/vulgar: 1 mild, 3 very vulgar)}]`,{modelTier:'default',cache:false})}

/* ---------- daily mission: one button, 10 minutes ---------- */
const DSTEPS=[{k:'rev',t:'5 題綜合測驗',mode:'mix',n:5},{k:'sen',t:'3 句句子練習',mode:'build',alt:'sent',n:3},{k:'out',t:'寫一句日記或聊一輪'}];
function mstate(){const t=today();if(!t.mission||typeof t.mission!=='object')t.mission={done:[]};if(!Array.isArray(t.mission.done))t.mission.done=[];return t.mission}
function missionList(){const m=mstate();return `<div class="stack" style="gap:4px">${DSTEPS.map((st,i)=>{const d=m.done.includes(st.k)||(st.k==='out'&&today().diary);return `<span style="font-size:.92rem;${d?'color:var(--nopal);font-weight:600':'color:var(--muted)'}">${d?'✓':'○'} ${i+1}. ${st.t}</span>`}).join('')}</div>`}
function dailyLeft(){const m=mstate();return DSTEPS.filter(st=>!(m.done.includes(st.k)||(st.k==='out'&&today().diary)))}
function dailyBtn(){const l=dailyLeft();return !l.length?'今日任務完成，再練一輪':l.length===DSTEPS.length?'開始今日任務':'繼續：'+l[0].t}
function ensureWords(){if(Object.keys(S.words).length)return;const pk=(S.me&&S.me.packs)||['viaje'];pk.forEach(k=>addWords(PACKS[k].map(p=>({es:p[0],zh:p[1],en:p[2],ex:p[3],exZh:p[4],heat:p[5]||0,theme:k}))));toast('先幫你加入「'+pk.map(k=>THEMES[k]).join('、')+'」的單字')}
function startDaily(){S.ptheme='all';ensureWords();const l=dailyLeft();
  if(!l.length){startMode(statsW().err?'err':'flash');return}
  runStep(l[0])}
function runStep(st){
  if(st.k==='out'){if(aiOK()&&today().diary){chatStart(S.ptheme==='all'?'viaje':S.ptheme);return}go('diario');toast('最後一步：寫一句西文日記就完成');return}
  let mode=st.mode;if(st.alt&&!buildQueue(mode,'all').length)mode=st.alt;if(!buildQueue(mode,'all').length)mode='trans';
  startMode(mode,st.n,true)}
function markStep(){const m=mstate(),l=dailyLeft();if(l.length&&l[0].k!=='out'&&!m.done.includes(l[0].k))m.done.push(l[0].k);scheduleFlush(800)}
function dailyStepDone(){markStep();const l=dailyLeft(),acc=pct(P.right,P.right+P.wrong);
  return `<section class="card done"><p class="eyebrow">今日任務 ${DSTEPS.length-l.length}/${DSTEPS.length}</p><b class="n">${acc}%</b><p>這一步完成了${P.wrong?`，錯的 ${P.wrong} 題已進錯題本`:''}。</p>
   ${missionList()}
   <div class="row" style="justify-content:center">${l.length?`<button class="btn primary" data-act="dnext">下一步：${l[0].t}</button>`:'<p style="color:var(--nopal);font-weight:600">今日任務全部完成 ¡Bien hecho!</p>'}<button class="btn ghost" data-act="quit">先休息</button></div></section>`}
function dailyNext(){const l=dailyLeft();P={active:false};if(!l.length){go('hoy');return}runStep(l[0])}

function testLevel(ans){const w={A1:1,A2:1.2,B1:1.5,B2:1.8};let sc=0,mx=0;const by={A1:0,A2:0,B1:0,B2:0},tot={A1:0,A2:0,B1:0,B2:0};
  TEST.forEach((q,i)=>{mx+=w[q[0]];tot[q[0]]++;if(ans[i]===q[3]){sc+=w[q[0]];by[q[0]]++}});
  const lv=by.A1<2?'A0':by.A1<3||by.A2<2?'A1':by.A2<3||by.B1<2?'A2':by.B1<3||by.B2<1?'B1':'B2';
  const packs={A0:['viaje','comida','calle'],A1:['viaje','comida','calle'],A2:['viaje','bachata','buceo','calle'],B1:['banco','fiestas','cultura','bachata'],B2:['banco','fiestas','cultura','musica']}[lv];
  return{lv,pct:Math.round(sc/mx*100),by,tot,packs}}
function vTest(){const T=S.T||(S.T={i:0,ans:[]});
  if(T.i>=TEST.length){if(!T.res){T.res=testLevel(T.ans);S.me=Object.assign({},S.me,{level:T.res.lv==='A0'?'A1':T.res.lv,tested:dkey(),packs:T.res.packs});try{localStorage.setItem('orale-me',JSON.stringify(S.me))}catch(e){}if(S.profRef)S.profRef.update({me:S.me}).catch(()=>{})}
    const r=T.res,desc={A0:'剛起步：先學打招呼、點餐、問路。',A1:'入門：會簡單句子，先把現在式和日常單字打穩。',A2:'基礎：能聊日常，下一步是過去式和更長的句子。',B1:'中級：能聊經驗和想法，可以多練真人對話和虛擬式。',B2:'中高級：已經能流暢溝通，多練口語、俚語和聽力。'}[r.lv];
    const missed=TEST.map((q,i)=>T.ans[i]===q[3]?null:i).filter(x=>x!==null);
    return `<section class="panel"><p class="eyebrow">程度測驗結果</p><div class="row"><span class="lvl">${r.lv}</span><span class="pill learn">${r.pct} 分</span></div><p>${desc}</p>
     <div class="stack" style="gap:6px">${['A1','A2','B1','B2'].map(l=>`<div style="display:grid;grid-template-columns:2.5em 1fr 3em;gap:10px;align-items:center"><b>${l}</b><div style="height:8px;border-radius:4px;background:var(--sunk);overflow:hidden"><div style="height:100%;width:${pct(r.by[l],r.tot[l])}%;background:var(--cobalt)"></div></div><span class="note">${r.by[l]}/${r.tot[l]}</span></div>`).join('')}</div>
     <div class="rule"><b>推薦先學</b><span>${r.packs.map(k=>THEMES[k]).join('、')}</span></div>
     <div class="row"><button class="btn primary" data-act="tapply">加入推薦課程並回首頁</button><button class="btn ghost" data-act="go" data-v="hoy">只看結果</button><button class="btn ghost" data-act="test">重測</button></div></section>
     ${missed.length?`<section class="panel"><h2>答錯的題目</h2><ul class="plist">${missed.map(i=>{const q=TEST[i];return `<li style="grid-template-columns:1fr"><div><b>${esc(q[1])}</b></div><small>正確：${esc(q[2][q[3]])}${T.ans[i]!=null?`　你選：${esc(q[2][T.ans[i]])}`:''}</small></li>`}).join('')}</ul></section>`:''}`}
  const q=TEST[T.i];
  return `<section class="panel"><div class="prog"><span><b>程度測驗</b> · ${T.i+1}/${TEST.length}</span><button class="btn ghost" data-act="go" data-v="hoy">離開</button></div>
   <div style="height:6px;border-radius:3px;background:var(--sunk);overflow:hidden"><div style="height:100%;width:${Math.round(T.i/TEST.length*100)}%;background:var(--cobalt)"></div></div>
   <span class="tchip">${q[0]}</span><div class="prompt-zh" style="font-size:1.25rem">${esc(q[1])}${/[a-záéíóúñ]/i.test(q[1])&&!/[一-鿿]/.test(q[1])?` <button class="say" data-act="say" data-t="${esc(q[1].replace('___','…'))}">聽</button>`:''}</div>
   <div class="stack" style="gap:8px">${q[2].map((o,i)=>`<button class="btn" style="text-align:left;justify-content:flex-start" data-act="tans" data-o="${i}">${esc(o)}</button>`).join('')}<button class="btn ghost" data-act="tans" data-o="-1">不知道</button></div>
   ${T.i?'<div><button class="btn ghost" data-act="tback">上一題</button></div>':''}</section>`}

/* ---------- backup & move between versions ---------- */
function exportCode(){const d={v:1,at:new Date().toISOString(),me:S.me||{},words:S.words,diary:S.diary,log:S.log};return 'ORALE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function importCode(code){const raw=code.replace(/\s+/g,'').replace(/^ORALE1:/,'');const d=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!d||d.v!==1)throw 0;const n={w:0,d:0,days:0};
  const byEs={};Object.values(S.words).forEach(w=>byEs[clean(w.es)]=w);
  Object.values(d.words||{}).forEach(w=>{if(!w||!w.es)return;const cur=byEs[clean(w.es)];if(!cur){saveWord(Object.assign(newWord(w),w));n.w++}else if((w.seen||0)>(cur.seen||0))saveWord(Object.assign({},w,{id:cur.id}))});
  Object.entries(d.diary||{}).forEach(([k,e])=>{const cur=S.diary[k];if(!cur||(!cur.corrected&&e.corrected)||(e.text||'').length>(cur.text||'').length){saveDiary(Object.assign({},e,{date:k}));if(!cur)n.d++}});
  const L=d.log||{};Object.entries(L.days||{}).forEach(([k,v])=>{const cur=S.log.days[k];if(v&&(v.sec||v.items||v.diary))n.days++;if(!cur){S.log.days[k]=v;return}
    ['sec','right','wrong','unsure','items','newW','mastered','diary'].forEach(f=>cur[f]=Math.max(cur[f]||0,v[f]||0));['miss','fixes'].forEach(f=>cur[f]=[...new Set([...(cur[f]||[]),...(v[f]||[])])].slice(-40))});
  S.log.reports=Object.assign({},L.reports||{},S.log.reports||{});
  {const seen=new Set(classesList().map(c=>c.date+'|'+c.topic));S.log.classes=[...classesList(),...(L.classes||[]).filter(c=>!seen.has(c.date+'|'+c.topic))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,80)}
  const mi=Object.assign({},S.log.missions||{});Object.entries(L.missions||{}).forEach(([k,v])=>{if(!mi[k]||(v.stars||0)>(mi[k].stars||0))mi[k]=v});S.log.missions=mi;
  if((!S.me||!S.me.name)&&d.me&&d.me.name){S.me=d.me;try{localStorage.setItem('orale-me',JSON.stringify(S.me))}catch(e){}if(S.profRef)S.profRef.update({me:S.me}).catch(()=>{})}
  saveLocal();scheduleFlush(500);return n}

/* --- weak points --- */
const CATS={pasado:'過去式',conjugacion:'動詞變化',serestar:'ser／estar',genero:'陰陽性與冠詞',preposicion:'介系詞',acentos:'重音與拼字',vocabulario:'用字',orden:'語序'};
const CAT_FIX={pasado:'past',conjugacion:'conj',serestar:'conj',genero:'trans',acentos:'trans',preposicion:'coach',vocabulario:'flash',orden:'build'};
const CAT_PROMPT='"err_type":"main error type, one of: pasado, serestar, conjugacion, genero, preposicion, acentos, vocabulario, orden, ninguno"';
function addCat(c){if(!CATS[c])return;const t=today();if(!t.cat||typeof t.cat!=='object')t.cat={};t.cat[c]=(t.cat[c]||0)+1;scheduleFlush(2000)}
function normCat(x){x=strip(String(x||'').toLowerCase()).replace(/[^a-z]/g,'');if(!x||/ningun/.test(x))return'';if(/serestar/.test(x))return'serestar';if(/pasad|preter|imperf|tiempo/.test(x))return'pasado';if(/conjug/.test(x))return'conjugacion';if(/genero|articul/.test(x))return'genero';if(/prepos/.test(x))return'preposicion';if(/acent|ortogra/.test(x))return'acentos';if(/orden/.test(x))return'orden';if(/vocab|palabra/.test(x))return'vocabulario';return''}
function weakHTML(cur){const arr=Object.entries(cur.cat||{}).filter(([k])=>CATS[k]).sort((a,b)=>b[1]-a[1]);
  if(!arr.length)return `<section class="panel"><h2>弱點分析</h2><p class="muted">這週還沒有足夠的錯誤紀錄。多做句子練習、動詞變化、對話和日記，這裡會自動統計你最常錯的類型。</p></section>`;
  const mx=arr[0][1];
  return `<section class="panel"><h2>弱點分析</h2><p class="note">本週錯誤依類型統計，來源是練習、對話和日記批改。點「練這類」直接針對練。</p>
   <div class="stack" style="gap:8px">${arr.slice(0,6).map(([k,v])=>`<div style="display:grid;grid-template-columns:6.8em 1fr auto;gap:10px;align-items:center"><span>${CATS[k]}</span><div style="height:8px;border-radius:4px;background:var(--sunk);overflow:hidden"><div style="height:100%;width:${Math.round(v/mx*100)}%;background:var(--chile)"></div></div><button class="btn ghost" style="min-height:32px;padding:4px 8px" data-act="weakfix" data-c="${k}">練這類（${v}）</button></div>`).join('')}</div></section>`}

/* --- verb conjugation (offline, Mexico: ustedes, no vosotros) --- */

const TENSES={pres:'現在式',pret:'簡單過去 pretérito',imp:'未完成過去 imperfecto',fut:'未來式'};
const IRR={
 ser:{zh:'是',pres:'soy eres es somos son',pret:'fui fuiste fue fuimos fueron',imp:'era eras era éramos eran',fut:'seré serás será seremos serán'},
 estar:{zh:'在、處於（狀態）',pres:'estoy estás está estamos están',pret:'estuve estuviste estuvo estuvimos estuvieron',imp:'estaba estabas estaba estábamos estaban',fut:'estaré estarás estará estaremos estarán'},
 tener:{zh:'有',pres:'tengo tienes tiene tenemos tienen',pret:'tuve tuviste tuvo tuvimos tuvieron',imp:'tenía tenías tenía teníamos tenían',fut:'tendré tendrás tendrá tendremos tendrán'},
 ir:{zh:'去',pres:'voy vas va vamos van',pret:'fui fuiste fue fuimos fueron',imp:'iba ibas iba íbamos iban',fut:'iré irás irá iremos irán'},
 hacer:{zh:'做',pres:'hago haces hace hacemos hacen',pret:'hice hiciste hizo hicimos hicieron',imp:'hacía hacías hacía hacíamos hacían',fut:'haré harás hará haremos harán'},
 poder:{zh:'能夠',pres:'puedo puedes puede podemos pueden',pret:'pude pudiste pudo pudimos pudieron',imp:'podía podías podía podíamos podían',fut:'podré podrás podrá podremos podrán'},
 querer:{zh:'想要、愛',pres:'quiero quieres quiere queremos quieren',pret:'quise quisiste quiso quisimos quisieron',imp:'quería querías quería queríamos querían',fut:'querré querrás querrá querremos querrán'}};
const REG={hablar:'說',bailar:'跳舞',trabajar:'工作',enseñar:'教',bucear:'潛水',viajar:'旅行',comer:'吃',aprender:'學',vivir:'住',escribir:'寫'};
const ENDS={ar:{pres:'o as a amos an',pret:'é aste ó amos aron',imp:'aba abas aba ábamos aban'},er:{pres:'o es e emos en',pret:'í iste ió imos ieron',imp:'ía ías ía íamos ían'},ir:{pres:'o es e imos en',pret:'í iste ió imos ieron',imp:'ía ías ía íamos ían'}};
function conj(v,t){if(IRR[v])return IRR[v][t].split(' ');if(t==='fut')return'é ás á emos án'.split(' ').map(x=>v+x);const st=v.slice(0,-2);return ENDS[v.slice(-2)][t].split(' ').map(x=>st+x)}
const vzh=v=>IRR[v]?IRR[v].zh:REG[v];
function startConj(only){const lv=(S.me&&S.me.level)||'A2';const tl=/A0|A1/.test(lv)?['pres','pres','fut']:lv==='A2'?['pres','pret','pret','imp','fut']:['pres','pret','imp','imp','fut','pret'];
  const verbs=only||[...Object.keys(IRR),...Object.keys(REG)];const items=[];
  for(let i=0;i<10;i++){const v=verbs[Math.floor(Math.random()*verbs.length)],t=tl[Math.floor(Math.random()*tl.length)],p=Math.floor(Math.random()*5);items.push({v,t,p})}
  P={active:true,mode:'conj',queue:items,total:10,done:0,right:0,wrong:0};S.view='practicar';next()}
function conjCard(){const it=P.cur,ans=conj(it.v,it.t)[it.p],fb=P.fb;
  return `<section class="card"><span class="tchip">${TENSES[it.t]}</span><div class="prompt-zh" style="font-size:1.4rem">${esc(it.v)} <span class="muted" style="font-size:1rem">（${esc(vzh(it.v))}）</span></div>
   <p class="big" style="font-size:1.5rem">${esc(PERS[it.p])} ＿＿＿</p>
   ${fb?`<div class="fb ${fb.ok?'ok':'no'}"><b class="h">${fb.ok?'¡Bien!':'答案是'}</b><span class="big" style="font-size:1.3rem">${esc(PERS[it.p].split(' / ')[0])} ${esc(ans)} <button class="say" data-act="say" data-t="${esc(PERS[it.p].split(' / ')[0]+' '+ans)}">聽</button></span>${fb.you&&!fb.ok?`<span class="note">你寫：${esc(fb.you)}</span>`:''}${fb.note?`<span class="note">${esc(fb.note)}</span>`:''}</div>
    <table class="cmp" style="font-size:.9rem"><tbody>${conj(it.v,it.t).map((f,i)=>`<tr><td>${PERS[i]}</td><td style="${i===it.p?'font-weight:700;color:var(--cobalt)':''}">${esc(f)}</td></tr>`).join('')}</tbody></table>
    <button class="btn primary" data-act="next" id="nextbtn">下一題</button>`
   :`<input id="ans" placeholder="寫出變化後的動詞" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button class="btn primary grow" data-act="kcheck">檢查</button><button class="btn ghost" data-act="tskip">不會</button></div>`}</section>`}
function conjGrade(you){const it=P.cur,ans=conj(it.v,it.t)[it.p],c=you?check(you,ans):{ok:false};
  P.done++;c.ok?P.right++:P.wrong++;const t=today();t.items++;c.ok?t.right++:t.wrong++;
  if(!c.ok){requeue(it);addCat(it.v==='ser'||it.v==='estar'?'serestar':(it.t==='pret'||it.t==='imp')?'pasado':'conjugacion')}else if(c.note)addCat('acentos');
  scheduleFlush(2000);P.fb={ok:c.ok,you,note:c.note};render();setTimeout(()=>{const b=$('#nextbtn');if(b)b.focus()},30)}

const oaKey=()=>{try{return localStorage.getItem('orale-oakey')||''}catch(e){return''}};
const AUD={};let curAudio=null;
function hush(){try{speechSynthesis.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}}
async function speakAI(text,rate,fin,opt,fallback){try{
  const voice=opt&&opt.who==='B'?(VS.oavoice==='ash'?'coral':'ash'):(VS.oavoice||'coral');const key=voice+'|'+text;let url=AUD[key];
  if(!url){const r=await fetch('https://api.openai.com/v1/audio/speech',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+oaKey()},body:JSON.stringify({model:'gpt-4o-mini-tts',voice,input:text,response_format:'mp3',instructions:'Habla en español de México (Ciudad de México), con voz cálida, natural y relajada, como platicando con un amigo. Pronuncia con claridad.'})});
    if(!r.ok)throw r.status;url=AUD[key]=URL.createObjectURL(await r.blob())}
  hush();const a=new Audio(url);curAudio=a;a.playbackRate=Math.max(.6,Math.min(1.3,rate/.9));a.onended=()=>{if(curAudio===a)curAudio=null;fin()};a.onerror=fallback;await a.play()}
  catch(e){if(e===401)toast('OpenAI 金鑰不正確，先改用手機語音');fallback()}}

function timelineHTML(arr){return `<ul class="tl">${arr.map(h=>`<li><b class="y">${esc(h[0])}</b>　<b>${esc(h[1])}</b><div>${esc(h[2])} <button class="say" data-act="say" data-t="${esc(h[2])}">聽</button></div><span class="note">${esc(h[3])}</span></li>`).join('')}</ul>`}
function quizHTML(src){const Q=S.HQ&&S.HQ.src===src?S.HQ:null;if(!Q)return `<div class="row"><button class="btn primary" data-act="hqstart" data-s="${src}">年代小測驗（5 題）</button></div>`;
  if(Q.i>=Q.qs.length)return `<div class="fb ok"><b class="h">測驗完成：${Q.ok}/${Q.qs.length}</b></div><div class="row"><button class="btn" data-act="hqstart" data-s="${src}">再考一次</button></div>`;
  const q=Q.qs[Q.i];return `<div class="rule"><b>${Q.i+1}/${Q.qs.length}　「${esc(q.t)}」是哪個時間？</b><div class="stack" style="gap:6px">${q.opts.map((o,i)=>`<button class="btn" style="justify-content:flex-start;${Q.res!=null?(o===q.a?'background:var(--nopal-soft);color:var(--nopal)':i===Q.res?'background:var(--chile-soft);color:var(--chile)':''):''}" data-act="hqpick" data-i="${i}" ${Q.res!=null?'disabled':''}>${esc(o)}</button>`).join('')}</div>${Q.res!=null?`<span class="note">${esc(q.note)}</span><div><button class="btn primary" data-act="hqnext">下一題</button></div>`:''}</div>`}
function hqStart(src){const arr=src==='b'?BHIST:HIST,pick=shuffle(arr.map((_,i)=>i)).slice(0,5);
  S.HQ={src,i:0,ok:0,res:null,qs:pick.map(i=>{const h=arr[i],others=shuffle([...new Set(arr.map(x=>x[0]).filter(y=>y!==h[0]))]).slice(0,3);return{t:h[1],a:h[0],note:h[3],opts:shuffle([h[0],...others])}})}}

function vBachataHist(){return `<section class="panel"><h1>Bachata 的歷史</h1><p class="muted">從多明尼加鄉下被看不起的「苦澀音樂」，到聯合國非物質文化遺產。跳舞時知道這些，跟舞伴聊天更有料。</p>${quizHTML('b')}

/* --- lyric practice: public-domain songs + your own pasted lyrics --- */
const mySongs=()=>{try{return JSON.parse(localStorage.getItem('orale-mysongs')||'[]')}catch(e){return[]}};
function saveMySongs(a){try{localStorage.setItem('orale-mysongs',JSON.stringify(a))}catch(e){toast('這個瀏覽器不能儲存')}}
function songsAll(){return[...SING.map((s,i)=>({k:'pd'+i,t:s.t,by:s.by,note:s.note,lines:s.lines.map(l=>({es:l[0],zh:l[1],tip:l[2]}))})),
  ...mySongs().map((s,i)=>({k:'my'+i,mine:i,t:s.t,by:'我貼的歌詞',note:'只存在這台裝置，不會上傳。',lines:s.lines.map(x=>({es:x,zh:'',tip:''}))}))]}
function gapIdx(line){const ws=line.split(/\s+/);const c=ws.map((w,i)=>[i,strip(clean(w)).length]).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]);return c.slice(0,ws.length>=5?2:1).map(x=>x[0])}
function lyricHTML(){const all=songsAll();const L=S.LY||(S.LY={k:all[0].k,mode:'read',i:0});let s=all.find(x=>x.k===L.k);if(!s){s=all[0];L.k=s.k}L.i=Math.min(L.i,s.lines.length-1);
  const modes=[['read','看歌詞'],['line','逐句跟唱'],['gap','填空'],['kara','朗讀卡拉 OK']];
  const ln=s.lines[L.i];let body='';
  if(L.mode==='read')body=`<ol class="plist" style="padding-left:0">${s.lines.map(l=>`<li style="grid-template-columns:1fr"><div><b style="font-size:1.05rem">${esc(l.es)}</b> <button class="say" data-act="say" data-t="${esc(l.es)}">聽</button></div>${l.zh||l.tip?`<small>${esc(l.zh)}${l.tip?` · <span style="color:var(--cobalt)">${esc(l.tip)}</span>`:''}</small>`:''}</li>`).join('')}</ol>`;
  else if(L.mode==='kara')body=`<div class="row"><button class="btn primary" data-act="karaplay">${PL?'停止':'從頭朗讀'}</button><span class="note">手機語音是用「念」的，不會唱；用來對節奏和咬字。</span></div><div class="stack" style="gap:4px">${s.lines.map((l,i)=>`<div class="lyl" id="lyk${i}" style="font-size:1.05rem">${esc(l.es)}</div>`).join('')}</div>`;
  else{const prog=`<div class="prog"><span>第 ${L.i+1} / ${s.lines.length} 句</span><span><button class="btn ghost" data-act="lyprev" ${L.i?'':'disabled'}>上一句</button><button class="btn ghost" data-act="lynext" ${L.i<s.lines.length-1?'':'disabled'}>下一句</button></span></div>`;
    if(L.mode==='line'){const fb=L.fb;body=prog+`<div class="prompt-zh" style="font-size:1.25rem">${fb?fb.T.map((x,k)=>`<span style="${fb.ok[k]?'':'color:var(--chile);text-decoration:underline'}">${esc(x)}</span>`).join(' '):esc(ln.es)}</div>${ln.zh?`<p class="muted">${esc(ln.zh)}</p>`:''}${ln.tip?`<p class="note" style="color:var(--cobalt)">${esc(ln.tip)}</p>`:''}
      <div class="row"><button class="btn" data-act="say" data-t="${esc(ln.es)}">聽</button><button class="btn" data-act="sayslow" data-t="${esc(ln.es)}">慢速</button>${s.mine!=null&&aiOK()?'<button class="btn ghost" data-act="lyexplain">解釋這句</button>':''}</div><div id="lyex"></div>
      ${fb?`<div class="fb ${fb.score>=80?'ok':'no'}"><b class="h">清楚度 ${fb.score} 分</b><span class="note">系統聽到：${esc(fb.you)}</span></div><div class="row"><button class="btn" data-act="lyretry">再唱一次</button>${L.i<s.lines.length-1?'<button class="btn primary" data-act="lynext">下一句</button>':'<span style="color:var(--nopal);font-weight:600">整首唱完了！</span>'}</div>`
      :`<div class="chatin"><button class="mic" data-act="mic" data-for="lyans">唱／念出來</button><textarea id="lyans" rows="2" placeholder="跟著唱或念這一句"></textarea></div><div class="row"><button class="btn primary grow" data-act="lycheck">評分</button></div><div class="help" id="michelp" hidden></div>`}`}
    else{const ws=ln.es.split(/\s+/),gi=gapIdx(ln.es),fb=L.fb;
      body=prog+`<div class="prompt-zh" style="font-size:1.2rem;line-height:2.2">${ws.map((w,j)=>gi.includes(j)?(fb?`<b style="color:${fb.r[j]?'var(--nopal)':'var(--chile)'}">${esc(w)}</b>`:`<input class="gapin" id="gap${j}" placeholder="${esc(strip(clean(w))[0]||'')}${'_'.repeat(Math.max(1,strip(clean(w)).length-1))}" size="${Math.max(4,w.length)}" autocomplete="off" autocapitalize="off" spellcheck="false">`):esc(w)).join(' ')}</div>
      ${ln.zh?`<p class="muted">${esc(ln.zh)}</p>`:''}<div class="row"><button class="btn" data-act="say" data-t="${esc(ln.es)}">聽這句</button>${fb?(L.i<s.lines.length-1?'<button class="btn primary" data-act="lynext">下一句</button>':'<span style="color:var(--nopal);font-weight:600">整首完成！</span>'):'<button class="btn primary" data-act="gapcheck">檢查</button>'}</div>`}}
  return `<div class="chips">${all.map(x=>`<button class="chip ${x.k===s.k?'on':''}" data-act="lypick" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div>

/* --- Duolingo-style mixed lesson --- */
function startMix(ids,limit,daily){let ws=ids?ids.map(id=>S.words[id]).filter(Boolean):buildQueue('flash',S.ptheme||'all').map(id=>S.words[id]).filter(Boolean);
  const all=Object.values(S.words);if(all.length<4){toast('單字庫至少要 4 個字，先到「課程」加入一組');go('lecciones');return}
  const n=limit||10;ws=ws.slice(0,Math.min(n,8));if(!ws.length)ws=shuffle(all).slice(0,Math.min(n,8));
  const types=['mc','listen','type'],qs=ws.map((w,i)=>({type:types[i%3],id:w.id}));
  if(n>=6&&ws.length>=4){const pool=shuffle(ws).slice(0,Math.min(5,ws.length));qs.splice(Math.min(4,qs.length),0,{type:'match',ids:pool.map(w=>w.id)})}
  const fin=qs.slice(0,n).map(q=>{if(q.type==='mc'||q.type==='listen'){const w=S.words[q.id],f=q.type==='mc'?'zh':'es',others=shuffle(all.filter(x=>x.id!==w.id&&x[f]&&x[f]!==w[f])).slice(0,3).map(x=>x[f]);q.ans=w[f];q.opts=shuffle([w[f],...others])}
    if(q.type==='match'){q.left=q.ids.slice();q.right=shuffle(q.ids.slice());q.done=[];q.sel=null;q.miss=0}return q});
  P={active:true,mode:'mix',queue:fin,total:fin.length,done:0,right:0,wrong:0,xp:0,combo:0,best:0,daily:!!daily};S.view='practicar';next()}
function mixCard(){const q=P.cur,fb=P.fb,w=q.id?S.words[q.id]:null;
  const top=`<div class="row" style="justify-content:space-between"><span class="tchip">${{mc:'選出意思',listen:'聽音選字',type:'打字翻譯',match:'配對'}[q.type]}</span><span class="pill ok">${P.xp} XP${P.combo>=3?` · 連對 ${P.combo}`:''}</span></div>`;
  const fbH=fb?`<div class="fb ${fb.ok?'ok':'no'}"><b class="h">${fb.ok?(P.combo>=3?`¡Increíble! 連對 ${P.combo} 題 +15 XP`:'¡Bien! +10 XP'):'答案是'}</b>${w?`<span class="big" style="font-size:1.3rem">${esc(w.es)} <button class="say" data-act="say" data-t="${esc(w.es)}">聽</button></span><span class="muted">${esc(w.zh)}</span>`:''}${fb.note?`<span class="note">${esc(fb.note)}</span>`:''}</div><button class="btn primary" data-act="next" id="nextbtn">繼續</button>`:'';
  if(q.type==='mc')return `<section class="card">${top}<div class="big">${esc(w.es)} <button class="say" data-act="say" data-t="${esc(w.es)}">聽</button></div><div class="stack" style="gap:8px">${q.opts.map((o,i)=>`<button class="btn" style="justify-content:flex-start;text-align:left;${fb?(o===q.ans?'background:var(--nopal-soft);color:var(--nopal)':i===fb.pick?'background:var(--chile-soft);color:var(--chile)':''):''}" data-act="mxpick" data-i="${i}" ${fb?'disabled':''}>${esc(o)}</button>`).join('')}</div>${fbH}</section>`;
  if(q.type==='listen')return `<section class="card">${top}<div class="row" style="justify-content:center"><button class="orb speak" style="width:88px;height:88px;font-size:1.3rem" data-act="mxplay" aria-label="播放">聽</button><button class="btn ghost" data-act="sayslow" data-t="${esc(w.es)}">慢速</button></div><div class="stack" style="gap:8px">${q.opts.map((o,i)=>`<button class="btn" style="justify-content:flex-start;${fb?(o===q.ans?'background:var(--nopal-soft);color:var(--nopal)':i===fb.pick?'background:var(--chile-soft);color:var(--chile)':''):''}" data-act="mxpick" data-i="${i}" ${fb?'disabled':''}>${esc(o)}</button>`).join('')}</div>${fbH}</section>`;
  if(q.type==='type')return `<section class="card">${top}<div class="prompt-zh">${esc(w.zh)}</div>${w.en?`<p class="muted">${esc(w.en)}</p>`:''}${fb?fbH:`<input id="ans" placeholder="用西文寫" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button class="btn primary grow" data-act="mxtype">檢查</button><button class="btn ghost" data-act="mxskip">不會</button></div>`}</section>`;
  const cell=(id,side)=>{const x=S.words[id],d=q.done.includes(id),sel=q.sel&&q.sel.side===side&&q.sel.id===id;return `<button class="btn" style="${d?'background:var(--nopal-soft);color:var(--nopal);opacity:.6':sel?'background:var(--cobalt);color:var(--on-cobalt)':''}" data-act="mxmatch" data-s="${side}" data-id="${esc(id)}" ${d?'disabled':''}>${esc(side==='l'?x.es:x.zh)}</button>`};
  return `<section class="card">${top}<p class="muted">把西文和中文配成一對。</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="stack" style="gap:8px">${q.left.map(id=>cell(id,'l')).join('')}</div><div class="stack" style="gap:8px">${q.right.map(id=>cell(id,'r')).join('')}</div></div>${q.done.length===q.left.length?`<div class="fb ok"><b class="h">配對完成${q.miss?`（錯 ${q.miss} 次）`:'，全對！'} +${q.miss?10:20} XP</b></div><button class="btn primary" data-act="next" id="nextbtn">繼續</button>`:''}</section>`}
function mixResult(ok,pick,note){const q=P.cur,w=q.id&&S.words[q.id];P.done++;
  if(ok){P.right++;P.combo++;P.best=Math.max(P.best,P.combo);P.xp+=P.combo>=3?15:10}else{P.wrong++;P.combo=0;if(!q.retry){const r=Object.assign({},q,{retry:true});P.queue.push(r)}}
  if(w)record(w,ok?'good':'bad');const t=today();t.xp=(t.xp||0)+(ok?(P.combo>=3?15:10):0);scheduleFlush(2000);
  P.fb={ok,pick,note};render();setTimeout(()=>{const b=$('#nextbtn');if(b)b.focus()},30)}
function mixDone(){const acc=pct(P.right,P.right+P.wrong);
  return `<section class="card done"><p class="eyebrow">綜合測驗完成</p><b class="n">+${P.xp} XP</b><p>正確率 ${acc}% · 最長連對 ${P.best} 題${P.wrong?` · 錯的字已進錯題本`:''}</p>
   <div class="row" style="justify-content:center"><button class="btn primary" data-act="start" data-mode="mix">再來一輪</button>${statsW().err?'<button class="btn bad" data-act="start" data-mode="err">練錯題</button>':''}<button class="btn ghost" data-act="quit">回選單</button></div></section>`}

async function clSave(b){const g=id=>($('#'+id)?.value||'').trim();const date=g('cl-date')||dkey(),topic=g('cl-topic'),lines=g('cl-words').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,40),fixL=g('cl-fix').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,20);
  if(!lines.length&&!fixL.length){toast('至少填一個單字或一句糾正');return}
  b.disabled=true;let items=[];
  if(lines.length){if(aiOK()){$('#clmsg').innerHTML='<span class="thinking">Claude 正在整理單字</span>';try{const r=await aiWords(lines);items=(Array.isArray(r)?r:[]).map(o=>({es:String(o.es||'').trim(),zh:String(o.zh||''),en:String(o.en||''),ex:String(o.ex||''),exZh:String(o.exZh||''),heat:Math.max(0,Math.min(3,Number(o.heat)||0))}))}catch(e){$('#clmsg').textContent=aiErr(e)+' 先用你寫的內容存。'}}
    if(!items.length)items=lines.map(l=>{const m=l.split(/\s*[=＝]\s*/);return m.length>=2?{es:m[0],zh:m.slice(1).join(' ')}:{es:l,zh:'（上課學的，待補中文）'}})}
  items.forEach(o=>o.theme='clase');addWords(items);
  const byEs={};Object.values(S.words).forEach(w=>byEs[clean(w.es)]=w);const ids=items.map(o=>byEs[clean(o.es)]?.id).filter(Boolean);
  const fixes=[];fixL.forEach(l=>{const m=l.split(/\s*(?:→|->|=>|＝>)\s*/);if(m.length<2||!m[1])return;const w=newWord({es:m[1],zh:'上課糾正：我原本說「'+m[0]+'」',theme:'clase',ex:m[1],exZh:'我原本說：'+m[0]});w.inErr=true;saveWord(w);ids.push(w.id);fixes.push(m[0]+' → '+m[1]);const t=today();t.fixes.push(m[0]+' → '+m[1])});
  S.log.classes=[{date,topic,words:items.map(o=>o.es),fixes,grammar:g('cl-gram'),hw:g('cl-hw'),ids},...classesList()].slice(0,80);today().newW+=fixes.length;scheduleFlush(300);
  S.CL={date,topic,n:items.length,f:fixes.length,ids};render()}

/* ---------- mind map: where my learning stands ---------- */
function themeStats(){const t0=dkey();return Object.keys(THEMES).map(k=>{const ws=Object.values(S.words).filter(w=>w.theme===k);
  const n=ws.length,mast=ws.filter(w=>(w.box||0)>=4).length,err=ws.filter(w=>w.inErr).length,seen=ws.filter(w=>w.seen).length,right=ws.reduce((a,w)=>a+(w.right||0),0),wrong=ws.reduce((a,w)=>a+(w.wrong||0),0),due=ws.filter(w=>w.seen&&w.due<=t0).length;
  const score=n?Math.round((mast*1+(seen-mast)*0.45)/n*100):0;
  return{k,label:THEMES[k],n,mast,err,seen,due,acc:pct(right,right+wrong),score}}).filter(x=>!['general','historia','clase'].includes(x.k)||x.n)}
function mmColor(t){if(!t.n)return'var(--line)';if(t.err>=Math.max(2,t.n*.25))return'var(--chile)';if(t.score>=60)return'var(--nopal)';if(t.score>=25)return'var(--cobalt)';return'var(--marigold)'}
function mindmap(){const ts=themeStats(),W=380,H=380,cx=W/2,cy=H/2,R1=136,s=statsW(),wk=sumRange(weekStart(dkey()),7);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="學習方向心智圖">`;
  ts.forEach((t,i)=>{const a=-Math.PI/2+i*2*Math.PI/ts.length,x=cx+R1*Math.cos(a),y=cy+R1*Math.sin(a),r=t.n?13+Math.min(13,t.n*0.7):9,c=mmColor(t);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="${t.n?2:1}" ${t.n?'':'stroke-dasharray="3 4"'} opacity=".7"/>`});
  svg+=`<circle cx="${cx}" cy="${cy}" r="46" fill="var(--cobalt)"/><text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="13" fill="var(--on-cobalt)" font-weight="600">我的西語</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="18" fill="var(--on-cobalt)" font-weight="700">${s.mast}/${s.total}</text><text x="${cx}" y="${cy+28}" text-anchor="middle" font-size="10" fill="var(--on-cobalt)">已熟悉</text>`;
  ts.forEach((t,i)=>{const a=-Math.PI/2+i*2*Math.PI/ts.length,x=cx+R1*Math.cos(a),y=cy+R1*Math.sin(a),r=t.n?13+Math.min(13,t.n*0.7):9,c=mmColor(t);
    const below=Math.sin(a)>0.3,above=Math.sin(a)<-0.3,ly=below?y+r+13:above?y-r-16:y+r+13;
    svg+=`<g class="mmnode" data-act="mmgo" data-t="${t.k}" style="cursor:pointer"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${t.n?'var(--surface)':'var(--sunk)'}" stroke="${c}" stroke-width="3"/>
      <text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${t.n?t.score+'%':'＋'}</text>
      <text x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${t.label}</text>
      <text x="${x.toFixed(1)}" y="${(ly+13).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${t.n?`${t.mast}/${t.n} 熟${t.err?` · 錯${t.err}`:''}`:'還沒開始'}</text></g>`});
  svg+='</svg>';
  const act=ts.filter(t=>t.n),best=[...act].sort((a,b)=>b.score-a.score)[0],weak=[...act].filter(t=>t.err).sort((a,b)=>b.err-a.err)[0]||[...act].sort((a,b)=>a.score-b.score)[0],empty=ts.filter(t=>!t.n).map(t=>t.label);
  const skills=[['單字量',Math.min(100,Math.round(s.total/3)),`${s.total} 個（目標 300）`],['熟悉度',pct(s.mast,s.total),`${s.mast} 個熟悉`],['本週正確率',pct(wk.right,wk.right+wk.wrong+wk.unsure),`${wk.right} 對 / ${wk.wrong} 錯`],['本週練習',Math.min(100,Math.round(wk.sec/42)),`${Math.round(wk.sec/60)} / 70 分鐘`],['日記習慣',Math.round(wk.diary/7*100),`${wk.diary} / 7 天`]];
  const bars=skills.map(([l,v,d])=>`<div style="display:grid;grid-template-columns:6.2em 1fr;gap:2px 10px;align-items:center"><span class="note" style="color:var(--ink)">${l}</span><div style="height:8px;border-radius:4px;background:var(--sunk);overflow:hidden"><div style="height:100%;width:${v}%;background:${v>=60?'var(--nopal)':v>=30?'var(--cobalt)':'var(--marigold)'};border-radius:4px"></div></div><span></span><span class="note" style="font-size:.78rem">${d}</span></div>`).join('');
  const tips=[];
  if(best)tips.push(`最強的方向是「${best.label}」，熟悉度 ${best.score}%。`);
  if(weak&&weak!==best)tips.push(`最需要補的是「${weak.label}」${weak.err?`，有 ${weak.err} 個錯題`:`，熟悉度只有 ${weak.score}%`}，點圓圈就能直接練。`);
  if(s.due)tips.push(`今天有 ${s.due} 個字到期要複習，先清掉再學新字。`);
  if(empty.length)tips.push(`還沒開始：${empty.slice(0,4).join('、')}${empty.length>4?' 等':''}，到「課程」一鍵加入。`);
  if(wk.diary<3)tips.push('日記本週不到 3 天，每天一句就好，它是口說和寫作進步最快的地方。');
  if(!act.length)tips.splice(0,tips.length,'還沒有單字資料。先到「課程」加入一個主題，心智圖就會長出來。');
  return `<section class="panel"><h2>學習方向心智圖</h2><p class="note">圓圈越大＝單字越多；數字＝熟悉度。綠色已熟、藍色進行中、橘色剛開始、紅色錯題多、虛線還沒開始。點圓圈直接練那個主題。</p>
   <div class="chart" style="max-width:460px;margin:0 auto;width:100%">${svg}</div>
   <div class="stack" style="gap:10px">${bars}</div>
   <div class="rule"><b>目前狀況</b>${tips.map(t=>`<span>${esc(t)}</span>`).join('')}</div></section>`}

/* ---------- speech (Mexican / Latin American Spanish only, never Chinese) ---------- */
let VOICE=null;
const VS=(()=>{try{return JSON.parse(localStorage.getItem('orale-voice')||'null')||{}}catch(e){return{}}})();
if(!VS.rate)VS.rate=.8;
function saveVS(){try{localStorage.setItem('orale-voice',JSON.stringify(VS))}catch(e){}}
const LANG=v=>v.lang.replace('_','-').toLowerCase();
function esVoices(){try{return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}catch(e){return[]}}
function voiceScore(v){const l=LANG(v),n=v.name;let s=0;
  if(l==='es-mx')s+=6;else if(l==='es-us'||l==='es-419')s+=4;else if(l==='es-es')s-=3;else s+=2;
  if(/natural|neural|online|premium|enhanced|mejorad/i.test(n))s+=4;
  if(/paulina|dalia|jorge|google/i.test(n))s+=2;
  if(/compact|eloquence|espeak/i.test(n))s-=4;
  if(v.localService===false)s+=1;return s}
function pickVoice(){const vs=esVoices();if(!vs.length){VOICE=null;return}
  VOICE=(VS.name&&vs.find(v=>v.name===VS.name))||[...vs].sort((a,b)=>voiceScore(b)-voiceScore(a))[0];fillVoiceSel()}
try{if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function fillVoiceSel(){const sel=document.getElementById('voicesel');if(!sel)return;const vs=esVoices().sort((a,b)=>voiceScore(b)-voiceScore(a));
  sel.innerHTML=vs.length?vs.map(v=>`<option value="${esc(v.name)}" ${VOICE&&v.name===VOICE.name?'selected':''}>${esc(v.name)}（${esc(v.lang)}）${LANG(v)==='es-es'?'・西班牙腔':''}</option>`).join(''):'<option>這台裝置沒有西班牙文語音</option>'}
// make text sound natural: drop emoji/markdown, read sentence by sentence with small pauses
function speechText(t){return String(t||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/[*_~#`>]/g,'').replace(/\([^)]*\)/g,'').replace(/\s*—\s*/g,', ').replace(/\s+/g,' ').trim()}
function speak(t,rate,onend,opt){let done=false;const fin=()=>{if(!done){done=true;onend&&onend()}};
  const text=speechText(t);if(!text){fin();return}const r=rate?rate*(VS.rate/.8):VS.rate;
  const sys=()=>{try{if(!('speechSynthesis' in window)){if(!onend)toast('這台裝置不支援朗讀');fin();return}if(!VOICE)pickVoice();speechSynthesis.cancel();
    const vv=(opt&&opt.voice)||VOICE,parts=text.match(/[^.!?…]+[.!?…]*/g)||[text];
    parts.map(x=>x.trim()).filter(Boolean).forEach((p,i,arr)=>{const u=new SpeechSynthesisUtterance(p);u.lang=vv?vv.lang:'es-MX';if(vv)u.voice=vv;u.rate=Math.max(.5,Math.min(1.2,r));u.pitch=(opt&&opt.pitch)||1;
      if(i===arr.length-1){u.onend=fin;u.onerror=fin}speechSynthesis.speak(u)});
    if(onend)setTimeout(fin,Math.max(5000,text.length*150/r))}catch(e){fin()}};
  if(S.standalone&&VS.engine==='openai'&&oaKey()){speakAI(text,r,fin,opt,sys);return}
  sys()}

function listen(b){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,el=document.getElementById(b.dataset.for);if(!el)return;
  if(REC){try{REC.stop()}catch(e){}return}

    r.onresult=e=>{got=true;let t='';for(const x of e.results)t+=x[0].transcript;el.value=base+t};

function promptOf(k){const n=Math.floor(parse(k)/864e5)+(S.pOff||0);return DPROMPTS[((n%DPROMPTS.length)+DPROMPTS.length)%DPROMPTS.length]}
function diaryStreak(){let n=0,k=dkey();if(!S.diary[k])k=addDays(k,-1);while(S.diary[k]){n++;k=addDays(k,-1)}return n}
function saveDiary(e){S.diary[e.date]=e;saveLocal();if(diaryCol)diaryCol.doc(e.date).set(JSON.parse(JSON.stringify(e))).catch(()=>toast('日記同步沒成功，先存在這台裝置。'))}
function diaryCard(){const e=S.diary[dkey()],p=promptOf(dkey());
  return e?`<section class="panel"><div class="row" style="justify-content:space-between"><h2>今天的日記 ✓</h2><span class="note">連續 ${diaryStreak()} 天</span></div><p>${esc(e.corrected||e.text)}</p></section>`
  :`<section class="panel"><div class="row" style="justify-content:space-between"><h2>今天的一句日記</h2><span class="note">連續 ${diaryStreak()} 天</span></div><p class="muted">今日題目：${esc(p[0])}</p><div><button class="btn mid" data-act="go" data-v="diario">寫一句就好</button></div></section>`}
function entryHTML(e,full){const words=(e.words||[]).map((w,i)=>`<button class="chip" data-act="dword" data-d="${e.date}" data-i="${i}">＋ ${esc(w.es)}・${esc(w.zh)}</button>`).join('');
  return `<div class="entry"><span class="note">${e.date.slice(5).replace('-','/')} · ${esc(e.prompt||'')}</span><p>${esc(e.text)}</p>
   ${e.corrected&&clean(e.corrected)!==clean(e.text)?`<div class="fb ok"><span><b>修正：</b>${esc(e.corrected)} ${'<button class="say" data-act="say" data-t="'+esc(e.corrected)+'">聽</button>'}</span>${e.note?`<span>${esc(e.note)}</span>`:''}</div>`:e.corrected?`<span class="okmark" style="align-self:flex-start">¡Perfecto! 沒有錯</span>`:''}
   ${full&&e.natural?`<span><b>墨西哥朋友會這樣寫：</b>${esc(e.natural)} <button class="say" data-act="say" data-t="${esc(e.natural)}">聽</button></span>`:''}
   ${full&&e.praise?`<span class="note">${esc(e.praise)}</span>`:''}${full&&words?`<div class="chips">${words}</div>`:''}
   ${full&&e.next?`<div class="diary-prompt"><span class="note">明天可以接著寫</span><b>${esc(e.next)}</b></div>`:''}</div>`}
function vDiario(){const k=dkey(),e=S.diary[k],p=promptOf(k),ws=weekStart(k),wk=[0,1,2,3,4,5,6].filter(i=>S.diary[addDays(ws,i)]).length;
  const past=Object.values(S.diary).filter(x=>x.date!==k).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  const editor=`<div class="diary-prompt"><span class="note">今日題目</span><b>${esc(p[0])}</b><div class="row"><button class="btn ghost" data-act="dstart" data-t="${esc(p[1])}">用「${esc(p[1])}」開頭</button><button class="btn ghost" data-act="dnew">換一題</button></div></div>
    <textarea id="diary" rows="4" placeholder="Hoy...（寫一句就好；卡住的地方可以先寫中文，AI 會幫你翻成墨西哥說法）"></textarea>
    <div class="row"><button class="mic" data-act="mic" data-for="diary">說西文</button><button class="btn primary" data-act="dai" ${aiOK()?'':'disabled'}>送出並批改</button><button class="btn" data-act="dsave">只儲存</button></div><p class="note" id="dmsg"></p><div class="help" id="michelp" hidden></div>`;
  return `<section class="panel"><p class="eyebrow">DIARIO · ${parse(k).getMonth()+1} 月 ${parse(k).getDate()} 日</p><h1>${e&&!S.dEdit?'今天寫好了，¡bien hecho!':'今天寫一句西文日記'}</h1>
    <p class="muted">連續寫 ${diaryStreak()} 天 · 本週 ${wk}/7 天。一句也算，重點是每天都寫。</p>
    ${e&&!S.dEdit?entryHTML(e,true)+`<div><button class="btn ghost" data-act="dedit">改寫今天的日記</button></div>`:editor}</section>
  ${past.length?`<section class="panel"><h2>以前的日記</h2>${past.map(x=>entryHTML(x,false)).join('')}</section>`:''}`}
async function diarySubmit(useAI,b){const ta=$('#diary'),text=(ta?.value||'').trim();if(!text){toast('先寫一句，一句就好');return}
  const k=dkey(),p=promptOf(k),old=S.diary[k],e={date:k,prompt:p[0],text,at:new Date().toISOString()};
  const t=today(),first=!t.diary;t.diary=1;scheduleFlush(1500);
  if(!useAI||!aiOK()){saveDiary(e);S.dEdit=false;toast(first?'寫好了！今天的日記 ✓':'已更新');render();return}
  b.disabled=true;$('#dmsg').innerHTML='<span class="thinking">Claude 正在批改你的日記</span>';
  try{const r=await S.sample.json(`You are a warm Mexican Spanish tutor correcting a learner's daily diary. ${learner()} ${MX}
Today's prompt: ${p[0]}
Diary entry (may mix Chinese where the learner got stuck): "${text}"
Correct it and translate any Chinese parts into natural Mexican Spanish, keeping the learner's meaning.
Reply with only JSON: {"corrected":"the full entry corrected, all in Spanish","natural":"how a Mexican friend would write the same thing casually","note_zh":"用台灣繁體中文 2–3 句說明主要錯誤和原因；全對就說哪裡用得好","praise_zh":"一句具體的鼓勵（台灣繁體中文）","words":[up to 3 useful words from the corrected text the learner may not know, {"es":"Spanish with article if noun","zh":"台灣繁體中文"}],"next_es":"one short follow-up question in Spanish to write about tomorrow","err_types":["main error types if any, each one of: pasado, serestar, conjugacion, genero, preposicion, acentos, vocabulario, orden"]}`,{modelTier:'default',cache:false});
    Object.assign(e,{corrected:String(r.corrected||''),natural:String(r.natural||''),note:String(r.note_zh||''),praise:String(r.praise_zh||''),words:(r.words||[]).slice(0,3).map(w=>({es:String(w.es||''),zh:String(w.zh||'')})).filter(w=>w.es),next:String(r.next_es||'')});
    if(e.corrected&&clean(e.corrected)!==clean(text)){t.fixes.push(`${text} → ${e.corrected}`);if(t.fixes.length>30)t.fixes.shift()}(Array.isArray(r.err_types)?r.err_types:[]).slice(0,3).forEach(x=>addCat(normCat(x)));
    saveDiary(e);S.dEdit=false;render()}
  catch(err){$('#dmsg').textContent=aiErr(err)+' 你的日記先存起來了。';saveDiary(Object.assign(old||{},e));b.disabled=false}}

async function boot(){loadLocal();render();

  const [db,user,sample]=await Promise.all([C.use('db'),C.use('user'),C.use('sample')].map(p=>Promise.resolve(p).catch(()=>null)));
  S.sample=sample||null;
  if(db&&user){let id=null;try{id=await user.id()}catch(e){}
    if(id){const profRef=db.doc(`data/users/${id}/profile`);
      try{const snap=await profRef.get();const d=snap.exists?JSON.parse(JSON.stringify(snap.data())):{};if(d.me&&Object.keys(d.me).length)S.me=d.me;else if(S.me&&S.me.name)d.me=S.me;d.lastOpen=dkey();await profRef.set(d);S.profRef=profRef}
      catch(e){render();return}

      wordsCol.onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=JSON.parse(JSON.stringify(d.data()))});

        S.words=o;saveLocal();renderSoft()},()=>{});
      logRef.onSnapshot(s=>{if(!s.exists||logDirty||logWriting)return;const d=JSON.parse(JSON.stringify(s.data()));S.log={days:d.days||{},reports:d.reports||{},missions:d.missions||{},classes:d.classes||[]};saveLocal();renderSoft()},()=>{});}}
  render()}
boot();
