 if(typeof a==='string'){var k=a,p=a.split(':');if(!ARTC[k])ARTC[k]=p[0]==='i'?sketchTile(p[1],760,560,DP,7+EP,false):sketchScene(p[1],760,560,DP,5+EP,false);
  var z=1+0.06*cl(lt/d),wipe=Math.min(1,lt/1.0);
  return '<div style="position:absolute;inset:0;transform:scale('+z+');transform-origin:50% 60%;clip-path:inset(0 '+((1-wipe)*100)+'% 0 0)">'+ARTC[k]+'</div>'+svg(sparkles(lt));}
 return FX(a,lt,d);}
function sparkles(lt){var s='';for(var k=0;k<7;k++){var q=((lt*0.35)+k/7)%1,x=60+((k*137)%640),y=520-q*480;s+='<text x="'+x+'" y="'+y+'" font-size="'+(28+k%3*10)+'" fill="#E3A544" opacity="'+(0.55*Math.sin(q*Math.PI))+'" font-family="DejaVu Sans">'+(k%2?'♪':'♫')+'</text>';}return s;}
var cur=-1;
function render(t){
 var i=0;while(i<E.sc.length-1&&t>=ST[i+1]-0.12)i++;var t0=Math.max(0,ST[i]-0.12),lt=t-t0,d=(i<E.sc.length-1?ST[i+1]-0.12:TOTAL)-t0,S=E.sc[i];
 if(i!==cur){cur=i;document.getElementById('card').innerHTML=S.c;}
 var a=cl(lt/0.28),out=i===E.sc.length-1?1:cl((d-lt)/0.18),o=Math.min(a,out);
 var c=document.getElementById('card');c.style.opacity=o;c.style.transform='translateY('+((1-a)*40)+'px) scale('+(0.96+0.04*e3(lt/0.4))+')';c.style.transformOrigin='0 50%';
 var ar=document.getElementById('art');ar.innerHTML=artFor2(S.a,lt,d);ar.style.opacity=o;ar.style.transform='translateY('+((1-e3(lt/0.4))*30)+'px)';
 var cls=D.clauses,k=0;while(k<cls.length-1&&t>=cls[k+1].st-0.08)k++;var sb=document.getElementById('sub');var txt=cls[k].t.replace(/[，：]$/,'');if(sb.textContent!==txt)sb.textContent=txt;
 var cst=cls[k].st-0.08;sb.style.opacity=cl((t-cst)/0.15);
 var dk=document.getElementById('dark');dk.style.opacity=(E.mood==='ballad'&&i>=1&&i<=2)?0.25*e3((lt-0.4)/0.5):0;
 document.getElementById('bar').style.width=(t/TOTAL*100)+'%';
}
render(0);
</script></body></html>
