<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jim 的營運分析、自動化與數位工具作品集。">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>作品集｜Jim</title>
  <style>
    /*
      設計假設：讀者從履歷進站，需要在十秒內看到定位、三個案例與延伸作品。
      內容全部由 content.json 提供；此檔只負責結構、樣式與呈現邏輯。
      聯絡方式暫以誠實占位呈現，待提供公開聯絡管道後再換內容。
    */
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --label: #1d1d1f;
      --label-2: rgba(60, 60, 67, 0.68);
      --separator: rgba(60, 60, 67, 0.18);
      --fill: rgba(118, 118, 128, 0.12);
      --tint: #007aff;
      --tint-soft: rgba(0, 122, 255, 0.11);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 16px 44px rgba(0, 0, 0, 0.07);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --display: ui-serif, "Iowan Old Style", "Songti TC", "Noto Serif TC", serif;
      --content: 1120px;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1c1c1e;
        --label: #f5f5f7;
        --label-2: rgba(235, 235, 245, 0.66);
        --separator: rgba(84, 84, 88, 0.65);
        --fill: rgba(118, 118, 128, 0.24);
        --tint: #0a84ff;
        --tint-soft: rgba(10, 132, 255, 0.18);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 18px 48px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--label);
      font: 16px/1.7 var(--font);
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }

    .shell {
      width: min(calc(100% - 40px), var(--content));
      margin-inline: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      border-bottom: 1px solid var(--separator);
    }
    .wordmark { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-decoration: none; }
    .header-note { color: var(--label-2); font-size: 13px; }

    .hero { padding: clamp(68px, 10vw, 128px) 0 clamp(62px, 8vw, 96px); }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--tint);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 880px;
      margin: 0;
      font: 600 clamp(42px, 7.2vw, 88px)/1.06 var(--display);
      letter-spacing: -0.055em;
      text-wrap: balance;
    }
    .hero-line { width: 72px; height: 3px; margin-top: 34px; background: var(--tint); }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .section-heading h2 { margin: 0; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
    .section-heading span { color: var(--label-2); font-size: 13px; font-variant-numeric: tabular-nums; }

    .cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .case {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 500px;
      padding: 28px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--separator);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }
    .case-number { color: var(--label-2); font-size: 13px; font-variant-numeric: tabular-nums; }
    .case h3 {
      margin: 44px 0 28px;
      font: 600 clamp(25px, 2.5vw, 34px)/1.15 var(--display);
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    .detail { margin: 0 0 18px; }
    .detail dt { margin-bottom: 4px; color: var(--label-2); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .detail dd { margin: 0; font-size: 15px; line-height: 1.65; text-wrap: pretty; }
    .case-result {
      margin: auto 0 20px;
      padding-top: 26px;
      border-top: 1px solid var(--separator);
    }
    .case-result span { display: block; margin-bottom: 5px; color: var(--label-2); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .case-result strong { font-size: 18px; font-variant-numeric: tabular-nums; }
    .open-link {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      border-radius: 12px;
      background: var(--tint-soft);
      color: var(--tint);
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }
    .open-link:hover { background: var(--fill); }
    .open-link:active { transform: scale(0.985); }
    .open-link::after { content: "↗"; font-size: 18px; }

    .others { padding: clamp(78px, 10vw, 118px) 0; }
    .tool-list { border-top: 1px solid var(--separator); }
    .tool-link {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--separator);
      font-weight: 600;
      text-decoration: none;
      transition: padding 160ms ease, color 160ms ease;
    }
    .tool-link span:last-child { color: var(--label-2); font-size: 13px; font-variant-numeric: tabular-nums; }
    .tool-link:hover { padding-inline: 8px; color: var(--tint); }

    footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      padding: 40px 0 max(48px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--separator);
    }
    footer h2 { margin: 0 0 8px; font: 600 clamp(28px, 4vw, 42px)/1.2 var(--display); letter-spacing: -0.03em; }
    footer p { margin: 0; color: var(--label-2); }
    .contact-placeholder { padding: 10px 14px; border-radius: 10px; background: var(--fill); color: var(--label-2); font-size: 14px; }

    .state { min-height: 52vh; display: grid; place-items: center; color: var(--label-2); text-align: center; }
    .state[hidden] { display: none; }

    @media (max-width: 860px) {
      .cases { grid-template-columns: 1fr; }
      .case { min-height: 0; }
      .case h3 { margin-top: 28px; }
      .case-result { margin-top: 26px; }
    }

    @media (max-width: 520px) {
      .shell { width: min(calc(100% - 32px), var(--content)); }
      header { min-height: 64px; }
      .header-note { display: none; }
      .hero { padding-top: 58px; }
      h1 { font-size: clamp(38px, 12.3vw, 52px); }
      .section-heading { align-items: center; }
      .case { padding: 24px; border-radius: 18px; }
      footer { grid-template-columns: 1fr; align-items: start; }
      .contact-placeholder { justify-self: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="wordmark" href="../" aria-label="回到 Jim 首頁">JIM / PORTFOLIO</a>
      <span class="header-note">營運分析・流程自動化・數位工具</span>
    </header>

    <main id="content" hidden>
      <section class="hero" aria-labelledby="headline">
        <p class="eyebrow">Selected work</p>
        <h1 id="headline"></h1>
        <div class="hero-line" aria-hidden="true"></div>
      </section>

      <section aria-labelledby="cases-title">
        <div class="section-heading">
          <h2 id="cases-title">案例</h2>
          <span>03 / 代表作品</span>
        </div>
        <div class="cases" id="cases"></div>
      </section>

      <section class="others" aria-labelledby="others-title">
        <div class="section-heading">
          <h2 id="others-title">其他工具</h2>
          <span>快速打開</span>
        </div>
        <div class="tool-list" id="others"></div>
      </section>
    </main>

    <div class="state" id="state" role="status">正在讀取作品內容⋯</div>

    <footer>
      <div>
        <h2>想聊聊一個問題？</h2>
        <p>聯絡方式將在正式公開前補上。</p>
      </div>
      <span class="contact-placeholder">聯絡方式待補</span>
    </footer>
  </div>

  <script>
    const escapeHtml = (value) => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const safeUrl = (value) => {
      const url = String(value || "").trim();
      return /^(?:https?:\/\/|\.\.\/|\.\/|#)/.test(url) ? escapeHtml(url) : "#";
    };

    function render(data) {
      if (!data || typeof data.headline !== "string" || !Array.isArray(data.cases) || !Array.isArray(data.others)) {
        throw new Error("content.json 格式不正確");
      }

      document.querySelector("#headline").textContent = data.headline;
      document.querySelector("#cases").innerHTML = data.cases.map((item, index) => `
        <article class="case">
          <span class="case-number">${String(index + 1).padStart(2, "0")}</span>
          <h3>${escapeHtml(item.title)}</h3>
          <dl class="detail">
            <dt>問題</dt>
            <dd>${escapeHtml(item.problem)}</dd>
          </dl>
          <dl class="detail">
            <dt>做法</dt>
            <dd>${escapeHtml(item.approach)}</dd>
          </dl>
          <p class="case-result"><span>結果</span><strong>${escapeHtml(item.result)}</strong></p>
          <a class="open-link" href="${safeUrl(item.url)}">打開<span class="sr-only"></span></a>
        </article>
      `).join("");

      document.querySelector("#others").innerHTML = data.others.map((item, index) => `
        <a class="tool-link" href="${safeUrl(item.url)}">
          <span>${escapeHtml(item.title)}</span>
          <span>${String(index + 1).padStart(2, "0")} ↗</span>
        </a>
      `).join("");

      document.querySelector("#state").hidden = true;
      document.querySelector("#content").hidden = false;
    }

    fetch("./content.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        console.error("作品內容載入失敗：", error);
        document.querySelector("#state").textContent = "作品內容暫時無法載入，請稍後再試。";
      });
  </script>
</body>
</html>
