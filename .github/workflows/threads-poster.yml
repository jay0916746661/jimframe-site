name: Threads 自動發文

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post / loop / dry-run / check"
        default: "post"

permissions:
  contents: write

concurrency:
  group: threads-poster-${{ github.event.inputs.mode == 'check' && 'check' || 'post' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/threads-poster
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 發文（定時觸發時連續守 5 小時，每 5 分鐘檢查一次）
        timeout-minutes: 330
        env:
          THREADS_TOKENS: ${{ secrets.THREADS_TOKENS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'post' }}"
          git config user.name "threads-poster"
          git config user.email "threads-poster@users.noreply.github.com"
          cd tools/threads-poster
          if [ "$MODE" = "check" ]; then python poster.py --check; exit $?; fi
          if [ "$MODE" = "dry-run" ]; then python poster.py --dry-run; exit 0; fi
          ROUNDS=1; if [ "${{ github.event_name }}" = "schedule" ] || [ "$MODE" = "loop" ]; then ROUNDS=60; fi
          for i in $(seq 1 $ROUNDS); do
            git pull -q --rebase || true
            python poster.py
            git add queue.csv
            if ! git diff --cached --quiet; then
              git commit -q -m "Threads 發文結果 $(date -u +%F' '%H:%M)"
              git pull -q --rebase && git push -q || true
            fi
            if [ $i -lt $ROUNDS ]; then sleep 300; fi
          done
