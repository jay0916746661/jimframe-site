name: IG 定時發文

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  push:
    branches: [main]
    paths:
      - tools/meta-poster/ig_queue.csv
      - tools/meta-poster/ig_publish.py
  workflow_dispatch:
    inputs:
      mode:
        description: "post / check"
        default: "post"

permissions:
  contents: write

concurrency:
  group: ig-poster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/meta-poster
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 發文（定時或推送觸發時連續守 5 小時，每 5 分鐘檢查；GitHub 定時常常延遲或漏跑）
        timeout-minutes: 330
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: |
          git config user.name "ig-poster"
          git config user.email "ig-poster@users.noreply.github.com"
          cd tools/meta-poster
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then python ig_publish.py --check; exit $?; fi
          ROUNDS=60
          for i in $(seq 1 $ROUNDS); do
            # 每輪先拉最新佇列，已發的不會重發（11/2 坂本 EP01 重複事件）
            git pull -q --rebase origin main || true
            python ig_publish.py || true
            git add ig_queue.csv ig_status.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "IG 發文結果 $(date -u +%F' '%H:%M)"
              git pull -q --rebase origin main && git push -q || true
            fi
            if [ $i -lt $ROUNDS ]; then sleep 300; fi
          done
