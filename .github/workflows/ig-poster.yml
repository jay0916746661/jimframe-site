name: IG 定時發文

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  push:
    branches: [main]
    paths:
      - tools/meta-poster/ig_queue.csv
      - tools/meta-poster/ig_publish.py
  workflow_dispatch:
    inputs:
      mode:
        description: "post / check"
        default: "post"

permissions:
  contents: write

concurrency:
  group: ig-poster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/meta-poster
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 發文
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: |
          cd tools/meta-poster
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.mode }}" = "check" ]; then python ig_publish.py --check; fi
          if [ "${{ github.event.inputs.mode }}" != "check" ]; then python ig_publish.py; fi
      - name: 存回結果
        run: |
          git config user.name "ig-poster"
          git config user.email "ig-poster@users.noreply.github.com"
          git add tools/meta-poster/ig_queue.csv tools/meta-poster/ig_status.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "IG 發文結果 $(date -u +%F' '%H:%M)" && git pull -q --rebase && git push -q)
