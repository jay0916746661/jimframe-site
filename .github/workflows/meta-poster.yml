name: IG／FB 發文

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check / test / brand / apply"
        default: "check"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/meta-poster
            social/brand
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 執行
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: cd tools/meta-poster && python meta.py --${{ github.event.inputs.mode || 'check' }}
      - name: 存回 brand 檔
        if: github.event.inputs.mode == 'brand'
        run: |
          git config user.name "meta-poster"
          git config user.email "meta-poster@users.noreply.github.com"
          git add social/brand
          git diff --cached --quiet || (git commit -m "粉專品牌素材（IG 大頭貼與簡介）" && git pull --rebase && git push)
