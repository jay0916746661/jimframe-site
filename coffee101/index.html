<h1>台北咖啡地圖</h1><p class="lead">九十年前的西餐廳、公館的地下室、世界冠軍的吧台。20 家有故事的台北咖啡館，每一家都值得專程去坐一下。</p></section>
<div id="map"></div><p class="note">地圖上的點是大約位置，導航請用各店頁面的「在 Google 地圖打開」。營業時間常有變動，出發前請再確認。</p>
<section id="list"><div class="sec-h"><h2>20 家店的故事</h2><div class="chips" id="chips"><button class="chip on" data-g="all">全部</button><button class="chip" data-g="old">老店與老街</button><button class="chip" data-g="gongguan">公館溫羅汀</button><button class="chip" data-g="new">咖啡新浪潮</button></div></div>

<section class="nl"><h2>每週一家，寄給你</h2><p>台北咖啡地圖電子報即將推出。先追蹤 IG，第一期上線時會通知你。</p><a href="https://www.instagram.com/coffeestory101/" target="_blank" rel="noopener">追蹤 @coffeestory101</a></section>

const D=[{"n": 1, "t": "台北第一家咖啡館，到底是哪家？", "h": "台北第一家咖啡館是哪一家？答案其實不只一個。", "s": "維特咖啡原址", "a": "延平北路二段與南京西路口", "st": "check", "g": "old", "p": [25.0533, 121.5112]}, {"n": 2, "t": "波麗路", "h": "這家餐廳的椅背特別高，據說是因為相親。", "s": "波麗路西餐廳", "a": "台北市大同區民生西路 314 號", "st": "open", "g": "old", "p": [25.0578, 121.5132]}, {"n": 3, "t": "蜂大咖啡", "h": "西門町這家咖啡館，名字裡有個「蜂」字，因為它一開始是賣蜂蜜的。", "s": "蜂大咖啡", "a": "台北市萬華區成都路 42 號", "st": "open", "g": "old", "p": [25.0427, 121.5066]}, {"n": 4, "t": "南美咖啡", "h": "西門町成都路，有兩家同一年開的老咖啡館，就住隔壁。", "s": "南美咖啡", "a": "台北市萬華區成都路 44 號", "st": "open", "g": "old", "p": [25.0425, 121.5068]}, {"n": 5, "t": "野人咖啡", "h": "一九六〇年代末，西門町有一家咖啡館，開在防空洞裡。", "s": "野人咖啡（已歇業）", "a": "台北市萬華區峨嵋街一帶", "st": "closed", "g": "old", "p": [25.0432, 121.506]}, {"n": 6, "t": "溫羅汀", "h": "台北有一塊街區，名字是用三條路拼起來的。", "s": "溫羅汀", "a": "台北市大安區、中正區 溫州街・羅斯福路・汀州路一帶", "st": "open", "g": "gongguan", "p": [25.0175, 121.533]}, {"n": 7, "t": "海邊的卡夫卡", "h": "公館巷子裡，曾經有一家咖啡館，借了村上春樹的書名。", "s": "海邊的卡夫卡（已歇業）", "a": "原址 台北市中正區羅斯福路三段244巷2號", "st": "closed", "g": "gongguan", "p": [25.0158, 121.5318]}, {"n": 8, "t": "女巫店", "h": "台大對面的巷子裡，樓上是書店，樓下是一家叫「女巫店」的咖啡館。", "s": "女巫店", "a": "台北市大安區新生南路三段56巷7號1樓", "st": "open", "g": "gongguan", "p": [25.0198, 121.5338]}, {"n": 9, "t": "興波咖啡與吳則霖", "h": "二〇一六年六月，都柏林。61 位各國冠軍，只有一個人站上第一名：台灣的吳則霖。", "s": "興波咖啡 Simple Kaffa 華山店", "a": "台北市中正區忠孝東路二段27號", "st": "open", "g": "new", "p": [25.0443, 121.5268]}, {"n": 10, "t": "Fika Fika 陳志煌", "h": "北歐有一場烘豆比賽，沒有評審，由兩百多位業界人士盲測投票。二〇一三年，拿下冠軍的是一位台灣人。", "s": "Fika Fika Cafe", "a": "台北市中山區伊通街33號（伊通公園旁）", "st": "check", "g": "new", "p": [25.0527, 121.5338]}, {"n": 11, "t": "台灣第一家星巴克", "h": "一九九八年三月二十八日，台灣第一家星巴克在台北天母開幕。隔年的雜誌寫著：一杯熱拿鐵，105 元。", "s": "星巴克天玉門市", "a": "台北市士林區天玉街38巷18弄1號", "st": "check", "g": "new", "p": [25.1178, 121.5318]}, {"n": 12, "t": "小貓花園", "h": "全世界還在營業、最老的貓咖啡，不在日本，在台北士林。", "s": "小貓花園", "a": "台北市士林區福華路129號1樓（芝山站附近）", "st": "open", "g": "new", "p": [25.1032, 121.5228]}, {"n": 13, "t": "CITY CAFE", "h": "你每天買的超商咖啡，其實失敗過兩次。", "s": "7-ELEVEN CITY CAFE", "a": "全台門市", "st": "any", "g": "new", "p": null}, {"n": 14, "t": "丹堤咖啡", "h": "一杯咖啡 35 元，這句口號，最早不是超商喊的。", "s": "丹堤咖啡第一家店", "a": "台北市南京東路、光復南路口", "st": "closed", "g": "new", "p": [25.0522, 121.5577]}, {"n": 15, "t": "美而廉", "h": "一九五〇年代的台北，有一家西餐廳，樓上是攝影界的大本營。", "s": "美而廉原址", "a": "台北市中正區博愛路114號（已歇業）", "st": "closed", "g": "old", "p": [25.0423, 121.5117]}, {"n": 16, "t": "中山北路的美軍年代", "h": "台北市立美術館那一帶，七十多年前，是一片美軍營區。", "s": "亞里士餐廳", "a": "台北市中山區長安東路一段27號B1", "st": "open", "g": "old", "p": [25.049, 121.5248]}, {"n": 17, "t": "王策", "h": "十五克粉、兩百五十毫升水、兩分鐘。這是一杯世界冠軍手沖。", "s": "VWI by CHADWANG", "a": "台北市大安區忠孝東路三段251巷4弄16號", "st": "check", "g": "new", "p": [25.0424, 121.5398]}, {"n": 18, "t": "富錦街", "h": "附近沒有捷運站，卻有很多人專程來喝咖啡：台北富錦街。", "s": "富錦街", "a": "台北市松山區（民生社區，敦化北路至三民路一帶）", "st": "open", "g": "new", "p": [25.0612, 121.5566]}, {"n": 19, "t": "cama", "h": "有一家連鎖咖啡店，每一家門市都放著自己的烘豆機。", "s": "CAMA COFFEE ROASTERS 豆留文青", "a": "台北市信義區光復南路133號（松山文創園區）", "st": "open", "g": "new", "p": [25.044, 121.5603]}, {"n": 20, "t": "湛盧", "h": "二〇〇二年失業，買下倒閉公司留下的一台咖啡機。二十年後，一年賣八百萬包濾掛。", "s": "湛盧咖啡 大安店", "a": "台北市大安區新生南路一段161巷2-1號", "st": "open", "g": "new", "p": [25.0368, 121.5303]}];
const ST={open:"營業中",check:"出發前先確認",closed:"已歇業・可看原址",any:"到處都有"};
const pad=n=>String(n).padStart(2,"0"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let g="all";const grid=document.getElementById("grid");
function render(){grid.innerHTML=D.filter(d=>g==="all"||d.g===g).map(d=>`<a class="card" href="t${pad(d.n)}.html"><img loading="lazy" src="img/t${pad(d.n)}_1.jpg" alt="${esc(d.t)}"><div class="b"><h3>${esc(d.t)}</h3><div class="m"><span>${esc(d.s)}</span><span class="badge s-${d.st}">${ST[d.st]}</span></div><p>${esc(d.h)}</p></div></a>`).join("");}
document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;g=b.dataset.g;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));render();});
render();
try{const m=L.map("map",{scrollWheelZoom:false}).setView([25.055,121.53],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(m);
const C={open:"#9c2e24",check:"#c89242",closed:"#8a7a70"};const pts=[];
D.filter(d=>d.p).forEach(d=>{pts.push(d.p);L.circleMarker(d.p,{radius:8,color:"#fff",weight:2,fillColor:C[d.st]||"#9c2e24",fillOpacity:1}).addTo(m)
.bindPopup(`<b>${esc(d.s)}</b><br>${esc(d.h)}<br><a href="t${pad(d.n)}.html">讀這家的故事 →</a>`);});
m.fitBounds(pts,{padding:[30,30]});}catch(e){document.getElementById("map").style.display="none";}
</script></body></html>
