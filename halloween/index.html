<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萬聖節遊樂場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-sized arcade card, game switcher on top, play area in the middle, score + share below. Single dark look on purpose (night). */
:root{
  --night:#130a1f; --plum:#24123a; --plum-2:#33194f; --pumpkin:#ff8a1f; --slime:#b6f36a;
  --ghost:#fff6ee; --muted:rgba(255,246,238,.66); --line:rgba(255,246,238,.14); --danger:#ff5d73;
  --display:"Baloo 2","Noto Sans TC",ui-rounded,system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% 0%,rgba(255,214,150,.18),transparent 40%),radial-gradient(ellipse at 0% 100%,rgba(124,58,237,.35),transparent 55%),var(--night);color:var(--ghost);font-family:var(--body);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:16px}
header{display:grid;gap:4px;text-align:center}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.24em;color:var(--slime);text-transform:uppercase}
h1{margin:0;font:800 clamp(34px,9vw,48px)/1.05 var(--display);text-wrap:balance;text-shadow:0 0 18px rgba(255,138,31,.6),0 3px 0 #4a1a7a}
.sub{margin:0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:999px;background:var(--plum);border:1px solid var(--line)}
.tabs button{min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:700 15px var(--body);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--pumpkin);color:#2a0f00}
.tabs button:focus-visible,.btn:focus-visible{outline:3px solid var(--slime);outline-offset:2px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 18px var(--display);font-variant-numeric:tabular-nums}
.hud span{display:flex;gap:6px;align-items:center}
.hud small{font:600 12px var(--body);color:var(--muted)}
.arena{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--plum-2),var(--plum));border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;padding:24px;background:rgba(19,10,31,.78);backdrop-filter:blur(3px);z-index:5}
.overlay h2{margin:0;font:800 30px/1.1 var(--display)}
.overlay p{margin:0;color:var(--muted);font-size:15px;line-height:1.6;max-width:30ch;justify-self:center}
.btn{min-height:50px;padding:0 26px;border:0;border-radius:999px;background:var(--pumpkin);color:#2a0f00;font:800 18px var(--body);cursor:pointer;box-shadow:0 0 24px rgba(255,138,31,.5);justify-self:center}
.btn.ghost{background:transparent;color:var(--ghost);border:1px solid var(--line);box-shadow:none;font-size:15px;min-height:44px}
.result{font:800 54px/1 var(--display);color:var(--slime);text-shadow:0 0 18px rgba(182,243,106,.6);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hole{position:absolute;width:30%;aspect-ratio:1;display:grid;place-items:center}
.hole::after{content:"";position:absolute;bottom:8%;left:10%;right:10%;height:22%;border-radius:50%;background:rgba(0,0,0,.45)}
.pop{position:relative;z-index:1;width:84%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;transform:translateY(40%) scale(.2);opacity:0;transition:transform .14s ease-out,opacity .14s}
.pop.up{transform:none;opacity:1}
.pop svg{width:100%;height:100%;display:block;pointer-events:none}
.pop.hit{transform:scale(1.25) rotate(12deg);opacity:0}
.float{position:absolute;z-index:3;font:800 24px var(--display);pointer-events:none;animation:up .7s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.grid{position:absolute;inset:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.card{position:relative;border:0;padding:0;border-radius:16px;cursor:pointer;background:none;perspective:600px}
.card .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .f{background:repeating-linear-gradient(45deg,var(--pumpkin) 0 10px,#ffa443 10px 20px);border:3px solid #ffd7ad}
.card .f::after{content:"?";font:800 34px var(--display);color:#2a0f00}
.card .b{transform:rotateY(180deg);background:var(--ghost);font-size:clamp(30px,10vw,46px)}
.card.done .b{background:var(--slime)}
.share{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--plum);border:1px solid var(--line)}
.share p{margin:0;font-size:15px;line-height:1.6}
.share .t{user-select:all;-webkit-user-select:all;color:var(--muted);font-size:14px}
.best{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.best b{color:var(--ghost)}
input{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--night);color:var(--ghost);font:600 16px var(--body);width:min(100%,260px);justify-self:center}
.rank-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.overlay .err{color:var(--danger)}.muted{color:var(--muted)}
.board{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--plum);border:1px solid var(--line)}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.board h3{margin:0;font:800 20px var(--display)}
.scope{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--night)}.scope button{min-height:34px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:700 13px var(--body);cursor:pointer}.scope button[aria-pressed="true"]{background:var(--plum-2);color:var(--ghost)}
#board-list,.plist{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-variant-numeric:tabular-nums}
#board-list li{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,246,238,.05)}
#board-list li.me,.plist li.me{outline:2px solid var(--slime)}#board-list li.muted{display:block;background:none;text-align:center}
.rk{text-align:center}.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{justify-self:center;min-width:200px}.plist li{padding:6px 12px;border-radius:10px;background:rgba(255,246,238,.06);text-align:left}
.code{color:var(--slime);letter-spacing:.12em}
.race{position:absolute;top:8px;left:8px;right:8px;z-index:4;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none}
.race span{padding:4px 10px;border-radius:999px;background:rgba(19,10,31,.8);font:700 13px var(--body)}.race span.me{background:var(--pumpkin);color:#2a0f00}
footer{text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--pumpkin)}
@media (prefers-reduced-motion:reduce){.pop,.card .in{transition:none}.float{animation:none;opacity:0}}
</style>
</head><body>

<div class="wrap">
  <header>
    <div class="eyebrow">JimFrame · Halloween</div>
    <h1>萬聖節遊樂場</h1>
    <p class="sub">三個 30 秒小遊戲，玩完截圖標記 @jimframe</p>
  </header>

  <div class="tabs" role="tablist" aria-label="選遊戲">
    <button role="tab" id="tab-ghost" aria-selected="true" data-g="ghost">👻 抓幽靈</button>
    <button role="tab" id="tab-candy" aria-selected="false" data-g="candy">🍬 接糖果</button>
    <button role="tab" id="tab-memory" aria-selected="false" data-g="memory">🎃 翻翻樂</button>
  </div>

  <div class="hud" aria-live="polite">
    <span id="hud-l"><small>分數</small><b id="score">0</b></span>
    <span id="hud-r"><small>時間</small><b id="time">30</b></span>
  </div>

  <div class="arena" id="arena"></div>

  <section class="board" id="board" hidden aria-label="排行榜">
    <div class="board-head"><h3 id="board-title">排行榜</h3><div class="scope"><button type="button" data-scope="all" aria-pressed="true">全部</button><button type="button" data-scope="today" aria-pressed="false">今天</button></div></div>
    <ol id="board-list"></ol>
  </section>

  <section class="share" aria-label="分享成績">
    <div class="best"><span>抓幽靈最佳 <b id="b-ghost">–</b></span><span>接糖果最佳 <b id="b-candy">–</b></span><span>翻翻樂最佳 <b id="b-memory">–</b></span></div>
    <p class="t" id="share-text">玩完一場，這裡會出現可以貼到限動的戰績文字（遊戲結束畫面也能直接複製）。</p>
    <div class="row"><button class="btn ghost" id="copy" type="button">複製戰績</button></div>
  </section>

  <footer>照片、影片和萬聖節相框都在 <a href="../" >JimFrame 網站</a></footer>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const arena=$("#arena"),scoreEl=$("#score"),timeEl=$("#time"),hudL=$("#hud-l small"),hudR=$("#hud-r small");
const store={get(k){try{return JSON.parse(localStorage.getItem("hwg_"+k))}catch{return null}},set(k,v){try{localStorage.setItem("hwg_"+k,JSON.stringify(v))}catch{}}};
const SVG={
 ghost:'<svg viewBox="0 0 100 100"><path d="M18 52C18 22 82 22 82 52v34l-8-6-8 7-8-7-8 7-8-7-8 7-8-7-8 6z" fill="#fff6ee"/><ellipse cx="38" cy="50" rx="6" ry="8" fill="#2b1a3a"/><ellipse cx="62" cy="50" rx="6" ry="8" fill="#2b1a3a"/><circle cx="40" cy="47" r="2" fill="#fff"/><circle cx="64" cy="47" r="2" fill="#fff"/><ellipse cx="50" cy="64" rx="5" ry="6" fill="#2b1a3a"/><ellipse cx="27" cy="60" rx="6" ry="3.5" fill="#ff9cc0"/><ellipse cx="73" cy="60" rx="6" ry="3.5" fill="#ff9cc0"/></svg>',
 gold:'<svg viewBox="0 0 100 100"><path d="M18 52C18 22 82 22 82 52v34l-8-6-8 7-8-7-8 7-8-7-8 7-8-7-8 6z" fill="#ffd25a"/><path d="M34 22l6 10 10-14 10 14 6-10 4 16H30z" fill="#ff8a1f"/><ellipse cx="38" cy="52" rx="6" ry="8" fill="#5a2a00"/><ellipse cx="62" cy="52" rx="6" ry="8" fill="#5a2a00"/><path d="M42 64q8 8 16 0" stroke="#5a2a00" stroke-width="4" fill="none" stroke-linecap="round"/></svg>',
 bat:'<svg viewBox="0 0 100 100"><path d="M50 40c-8-12-28-16-44-6 8 2 12 8 12 16 6-6 12-6 16 2 4-6 10-6 14 0 4-6 10-6 14 0 4-8 10-8 16-2 0-8 4-14 12-16-16-10-36-6-44 6z" fill="#120818"/><circle cx="50" cy="44" r="12" fill="#120818"/><path d="M42 36l-2-12 8 8M58 36l2-12-8 8" fill="#120818"/><circle cx="45" cy="44" r="3" fill="#ff5d73"/><circle cx="55" cy="44" r="3" fill="#ff5d73"/></svg>'
};
let game="ghost",timers=[],raf=0,running=false;
const clearAll=()=>{timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);running=false;};
const setHud=(lab1,v1,lab2,v2)=>{hudL.textContent=lab1;scoreEl.textContent=v1;hudR.textContent=lab2;timeEl.textContent=v2;};
const showBest=()=>{["ghost","candy","memory"].forEach(g=>{const v=store.get(g);$("#b-"+g).textContent=v==null?"–":g==="memory"?v+" 步":v+" 分";});};
const overlay=(title,text,btn,big)=>{const o=document.createElement("div");o.className="overlay";o.innerHTML=`<h2>${title}</h2>${big!=null?`<div class="result">${big}</div>`:""}<p>${text}</p><div class="row"><button class="btn" type="button">${btn}</button>${big!=null?`<button class="btn ghost" type="button" data-copy>📋 複製戰績</button>`:""}</div>`;arena.appendChild(o);o.querySelector("[data-copy]")?.addEventListener("click",e=>copyShare(e.currentTarget));return o.querySelector(".btn");};
let played=false;const share=t=>{played=true;$("#share-text").textContent=t;};
const bestText=()=>{const g=store.get("ghost"),c=store.get("candy"),m=store.get("memory");const parts=[g!=null&&`抓幽靈 ${g} 分`,c!=null&&`接糖果 ${c} 分`,m!=null&&`翻翻樂 ${m} 步`].filter(Boolean);return parts.length?`我在 JimFrame 萬聖節遊樂場的最佳紀錄：${parts.join("、")} 🎃 你能贏我嗎？ @jimframe`:"";};
const floatAt=(x,y,txt,col)=>{const f=document.createElement("div");f.className="float";f.style.cssText=`left:${x}px;top:${y}px;color:${col}`;f.textContent=txt;arena.appendChild(f);setTimeout(()=>f.remove(),700);};

/* ---------- 抓幽靈 ---------- */
function ghostGame(opt={}){
 const battle=opt.battle||null;
 arena.innerHTML="";setHud("分數",0,"時間",30);
 const pos=[[3,12],[35,6],[67,12],[3,42],[35,36],[67,42],[3,72],[35,66],[67,72]];
 const holes=pos.map(([l,t])=>{const h=document.createElement("div");h.className="hole";h.style.left=l+"%";h.style.top=t+"%";const b=document.createElement("button");b.className="pop";b.type="button";b.setAttribute("aria-label","目標");h.appendChild(b);arena.appendChild(h);return b;});
 if(battle){start();}
 else{const go=overlay("抓幽靈 👻","30 秒內點冒出來的小幽靈。金幽靈 +3，蝙蝠 −2，越後面越快。","開始");go.onclick=e=>{e.target.closest(".overlay").remove();start();};
  if(DB)go.insertAdjacentHTML("afterend",'<button class="btn ghost" type="button" data-battle>⚔️ 找朋友對戰</button>'),arena.querySelector("[data-battle]").onclick=()=>openLobby();}
 function start(){let score=0,t=30,el=0;running=true;const rng=mulberry(battle?battle.seed:(Math.random()*1e9|0));
  const tick=setInterval(()=>{t--;el++;timeEl.textContent=t;if(t<=0)end();},1000);timers.push(tick);
  const spawn=()=>{if(!running)return;const r1=rng(),r2=rng();const free=holes.filter(b=>!b.classList.contains("up"));if(free.length){const b=free[r1*free.length|0];const kind=r2<.12?"gold":r2<.3?"bat":"ghost";b.dataset.k=kind;b.innerHTML=SVG[kind];b.classList.remove("hit");b.classList.add("up");
   const stay=Math.max(520,1100-el*20);timers.push(setTimeout(()=>b.classList.remove("up"),stay));}
   timers.push(setTimeout(spawn,Math.max(330,720-el*14)));};
  spawn();
  holes.forEach(b=>b.onpointerdown=e=>{if(!running||!b.classList.contains("up"))return;e.preventDefault();const k=b.dataset.k,v=k==="gold"?3:k==="bat"?-2:1;score=Math.max(0,score+v);scoreEl.textContent=score;if(battle)battle.onScore(score);
   const r=b.getBoundingClientRect(),a=arena.getBoundingClientRect();floatAt(r.left-a.left+r.width/3,r.top-a.top,(v>0?"+":"")+v,v>0?"#b6f36a":"#ff5d73");b.classList.add("hit");b.classList.remove("up");});
  function end(){clearAll();holes.forEach(b=>b.classList.remove("up"));const best=store.get("ghost");if(best==null||score>best)store.set("ghost",score);showBest();
   if(battle){battle.onEnd(score);return;}
   share(`我在 JimFrame 萬聖節遊樂場 30 秒抓了 ${score} 分的幽靈 👻 你能贏我嗎？ @jimframe`);
   const b=overlay("時間到！",best!=null&&score<=best?`最佳紀錄 ${best} 分，再一場？`:"新紀錄！截圖發限動標記 @jimframe","再玩一次",score);b.onclick=()=>ghostGame();addRank(b,"ghost",score);}
 }
}

/* ---------- 接糖果 ---------- */
function candyGame(){
 arena.innerHTML="";setHud("分數",0,"生命","❤️❤️❤️");
 const cv=document.createElement("canvas");arena.appendChild(cv);const x=cv.getContext("2d");
 let W,H,dpr;const size=()=>{const r=arena.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);};size();
 let bx=W/2,items=[],score=0,lives=3,last=0,spawnT=0,speed=1;
 const move=e=>{const r=arena.getBoundingClientRect();bx=Math.max(40,Math.min(W-40,e.clientX-r.left));};
 arena.onpointermove=move;arena.onpointerdown=move;
 const draw=()=>{x.clearRect(0,0,W,H);
  for(let i=0;i<14;i++){x.fillStyle="rgba(255,233,168,.5)";x.beginPath();x.arc((i*97)%W,(i*53)%(H*.5),1.5,0,7);x.fill();}
  // basket = pumpkin bucket
  const y=H-56;x.fillStyle="#ff8a1f";x.beginPath();x.ellipse(bx,y+18,44,30,0,0,7);x.fill();x.fillStyle="#2a0f00";x.beginPath();x.moveTo(bx-20,y+10);x.lineTo(bx-10,y+2);x.lineTo(bx-4,y+12);x.fill();x.beginPath();x.moveTo(bx+20,y+10);x.lineTo(bx+10,y+2);x.lineTo(bx+4,y+12);x.fill();
  x.beginPath();x.arc(bx,y+22,14,0.1*Math.PI,0.9*Math.PI);x.fill();x.strokeStyle="#5b8c2a";x.lineWidth=4;x.beginPath();x.arc(bx,y-4,36,Math.PI*1.15,Math.PI*1.85);x.stroke();
  x.textAlign="center";x.textBaseline="middle";items.forEach(it=>{x.font=`${it.s}px system-ui`;x.fillText(it.e,it.x,it.y);});};
 const loop=t=>{if(!running)return;const dt=Math.min(40,t-(last||t));last=t;spawnT-=dt;speed+=dt*0.00004;
  if(spawnT<=0){spawnT=Math.max(260,700-score*8);const r=Math.random();items.push({x:24+Math.random()*(W-48),y:-20,v:(1.6+Math.random()*1.4)*speed,e:r<.22?"🕷️":r<.32?"⭐":["🍬","🍭","🍫"][Math.random()*3|0],s:r<.22?34:30});}
  items.forEach(it=>it.y+=it.v*dt*.12);
  const by=H-56;items=items.filter(it=>{if(it.y>by-10&&it.y<by+30&&Math.abs(it.x-bx)<46){if(it.e==="🕷️"){lives--;floatAt(it.x-10,by-30,"−❤️","#ff5d73");}else{const v=it.e==="⭐"?5:1;score+=v;floatAt(it.x-10,by-30,"+"+v,"#b6f36a");}scoreEl.textContent=score;timeEl.textContent="❤️".repeat(Math.max(0,lives))||"—";return false;}return it.y<H+30;});
  draw();if(lives<=0)return end();raf=requestAnimationFrame(loop);};
 draw();
 overlay("接糖果 🍬","左右滑動南瓜桶接糖果。⭐ +5，被蜘蛛碰到扣一顆心，三顆心用完就結束。","開始").onclick=e=>{e.target.closest(".overlay").remove();running=true;last=0;raf=requestAnimationFrame(loop);};
 function end(){clearAll();const best=store.get("candy");if(best==null||score>best)store.set("candy",score);showBest();
  share(`我在 JimFrame 萬聖節遊樂場接了 ${score} 分的糖果 🍬🎃 換你試試 @jimframe`);
  const b=overlay("被蜘蛛抓到了！",best!=null&&score<=best?`最佳紀錄 ${best} 分，再一場？`:"新紀錄！截圖發限動標記 @jimframe","再玩一次",score);b.onclick=()=>candyGame();addRank(b,"candy",score);}
}

/* ---------- 翻翻樂 ---------- */
function memoryGame(){
 arena.innerHTML="";setHud("步數",0,"配對","0 / 6");
 const icons=["🎃","👻","🦇","🍬","🕷️","🌙"];const deck=[...icons,...icons].sort(()=>Math.random()-.5);
 const g=document.createElement("div");g.className="grid";arena.appendChild(g);
 let open=[],moves=0,pairs=0,lock=false;
 deck.forEach((ic,i)=>{const c=document.createElement("button");c.type="button";c.className="card";c.setAttribute("aria-label","翻開卡片 "+(i+1));c.innerHTML=`<div class="in"><div class="f"></div><div class="b">${ic}</div></div>`;c.dataset.ic=ic;g.appendChild(c);
  c.onclick=()=>{if(lock||c.classList.contains("open")||c.classList.contains("done"))return;c.classList.add("open");open.push(c);
   if(open.length===2){moves++;scoreEl.textContent=moves;const [a,b]=open;
    if(a.dataset.ic===b.dataset.ic){a.classList.add("done");b.classList.add("done");open=[];pairs++;timeEl.textContent=pairs+" / 6";if(pairs===6)timers.push(setTimeout(end,500));}
    else{lock=true;timers.push(setTimeout(()=>{a.classList.remove("open");b.classList.remove("open");open=[];lock=false;},750));}}};});
 function end(){const best=store.get("memory");if(best==null||moves<best)store.set("memory",moves);showBest();
  share(`我在 JimFrame 萬聖節遊樂場用 ${moves} 步翻完全部南瓜 🎃 你要幾步？ @jimframe`);
  const b=overlay("全部配對！",best!=null&&moves>=best?`最佳紀錄 ${best} 步，再挑戰？`:"新紀錄！截圖發限動標記 @jimframe","再玩一次",moves+" 步");b.onclick=()=>memoryGame();addRank(b,"memory",moves);}
}

/* ---------- 線上：排行榜＋即時對戰（Firebase Realtime Database，REST，不用金鑰）---------- */
const DB=""; // 例：https://jimframe-games-default-rtdb.asia-southeast1.firebasedatabase.app
const TS={".sv":"timestamp"};
const api=(path,method="GET",body)=>fetch(`${DB}/${path}.json`,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const nick=()=>{try{return localStorage.getItem("hwg_nick")||""}catch{return ""}};const setNick=v=>{try{localStorage.setItem("hwg_nick",v)}catch{}};
const pid=(()=>{let v;try{v=localStorage.getItem("hwg_pid")}catch{}if(!v){v=Math.random().toString(36).slice(2,10);try{localStorage.setItem("hwg_pid",v)}catch{}}return v;})();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanName=v=>v.replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,12);
function addRank(btn,game,value){if(!DB)return;const row=document.createElement("div");row.className="rank-row";
 row.innerHTML=`<input id="rank-name-${game}" maxlength="12" placeholder="暱稱（最多 12 字）" value="${esc(nick())}" aria-label="暱稱"><button class="btn ghost" type="button">🏆 上排行榜</button>`;
 btn.closest(".overlay").appendChild(row);const inp=row.querySelector("input"),b=row.querySelector("button");
 b.onclick=async()=>{const name=cleanName(inp.value);if(!name){inp.focus();return;}setNick(name);b.disabled=true;b.textContent="上傳中…";
  try{await api(`scores/${game}`,"POST",{name,score:value,t:TS});b.textContent="已上榜 ✓";loadBoard(game);}catch{b.disabled=false;b.textContent="上傳失敗，再按一次";}};}
let boardGame="ghost",boardScope="all";
async function loadBoard(g=boardGame){if(!DB)return;boardGame=g;const list=$("#board-list");$("#board-title").textContent={ghost:"抓幽靈",candy:"接糖果",memory:"翻翻樂"}[g]+"排行榜";
 list.innerHTML='<li class="muted">載入中…</li>';
 try{const low=g==="memory";const q=low?`orderBy="score"&limitToFirst=100`:`orderBy="score"&limitToLast=100`;
  const data=await fetch(`${DB}/scores/${g}.json?${q}`).then(r=>r.json())||{};
  let rows=Object.values(data).filter(r=>r&&typeof r.score==="number");if(boardScope==="today"){const d0=new Date();d0.setHours(0,0,0,0);rows=rows.filter(r=>r.t>=d0.getTime());}
  rows.sort((a,b)=>low?a.score-b.score||a.t-b.t:b.score-a.score||a.t-b.t);rows=rows.slice(0,15);
  list.innerHTML=rows.length?rows.map((r,i)=>`<li${r.name===nick()?' class="me"':""}><span class="rk">${["🥇","🥈","🥉"][i]||i+1}</span><span class="nm">${esc(r.name)}</span><b>${r.score}${low?" 步":" 分"}</b></li>`).join(""):'<li class="muted">還沒有人上榜，搶第一！</li>';}
 catch{list.innerHTML='<li class="muted">排行榜暫時連不上</li>';}}
/* 對戰房間 */
let room=null,poll=0;
const randCode=()=>Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.random()*31|0]).join("");
function stopRoom(){clearInterval(poll);poll=0;room=null;}
async function syncOffset(code){await api(`rooms/${code}/players/${pid}/seen`,"PUT",TS);const t=await api(`rooms/${code}/players/${pid}/seen`);return t-Date.now();}
function openLobby(prefill=""){clearAll();stopRoom();arena.innerHTML="";setHud("對戰","—","人數","—");
 const o=document.createElement("div");o.className="overlay";o.innerHTML=`<h2>⚔️ 抓幽靈對戰</h2><p>同一批幽靈、同時開始，30 秒比誰分數高。最多 6 人。</p>
 <input id="battle-name" maxlength="12" placeholder="你的暱稱" value="${esc(nick())}" aria-label="暱稱">
 <div class="row"><button class="btn" type="button" data-new>開新房間</button></div>
 <div class="row"><input id="battle-code" maxlength="4" placeholder="房號" value="${esc(prefill)}" aria-label="房號" style="width:7em;text-transform:uppercase"><button class="btn ghost" type="button" data-join>加入</button></div>
 <p class="err" hidden></p><button class="btn ghost" type="button" data-back>回單人模式</button>`;arena.appendChild(o);
 const err=m=>{const e=o.querySelector(".err");e.hidden=false;e.textContent=m;};
 const nm=()=>{const v=cleanName(o.querySelector("#battle-name").value);if(!v){err("先填暱稱");return null;}setNick(v);return v;};
 o.querySelector("[data-back]").onclick=()=>pick("ghost");
 o.querySelector("[data-new]").onclick=async()=>{const n=nm();if(!n)return;const code=randCode();
  try{await api(`rooms/${code}`,"PUT",{host:pid,seed:Math.random()*1e9|0,state:"lobby",created:TS,players:{[pid]:{name:n,score:0}}});enterRoom(code);}catch{err("開房失敗，稍後再試");}};
 o.querySelector("[data-join]").onclick=async()=>{const n=nm();if(!n)return;const code=o.querySelector("#battle-code").value.toUpperCase().trim();if(code.length!==4){err("房號是 4 碼");return;}
  try{const r=await api(`rooms/${code}`);if(!r)return err("找不到這個房間");if(r.state!=="lobby")return err("這局已經開始了");if(Object.keys(r.players||{}).length>=6)return err("房間滿了");
   await api(`rooms/${code}/players/${pid}`,"PUT",{name:n,score:0});enterRoom(code);}catch{err("連線失敗，稍後再試");}};}
async function enterRoom(code){const off=await syncOffset(code).catch(()=>0);room={code,off,phase:"lobby"};
 try{history.replaceState(null,"",`?room=${code}`)}catch{}
 arena.innerHTML="";const o=document.createElement("div");o.className="overlay";arena.appendChild(o);
 const link=`${location.origin}${location.pathname}?room=${code}`;
 const draw=r=>{const ps=Object.entries(r.players||{});setHud("房號",code,"人數",ps.length);
  if(r.state==="lobby"){o.innerHTML=`<h2>房號 <span class="code">${code}</span></h2><p>把房號或連結傳給朋友，人到齊後由房主按開始。</p>
   <ul class="plist">${ps.map(([id,p])=>`<li>${id===r.host?"👑 ":""}${esc(p.name)}${id===pid?"（你）":""}</li>`).join("")}</ul>
   <div class="row"><button class="btn ghost" type="button" data-link>📋 複製邀請連結</button>${r.host===pid?`<button class="btn" type="button" data-go ${ps.length<2?"disabled":""}>${ps.length<2?"等朋友加入…":"開始對戰"}</button>`:`<span class="muted">等房主開始…</span>`}</div>
   <button class="btn ghost" type="button" data-leave>離開房間</button>`;
   o.querySelector("[data-link]").onclick=async e=>{try{await navigator.clipboard.writeText(`來 JimFrame 萬聖節遊樂場跟我對戰抓幽靈 👻 房號 ${code}\n${link}`);e.target.textContent="已複製 ✓";}catch{e.target.textContent=link;}};
   o.querySelector("[data-go]")?.addEventListener("click",async()=>{await api(`rooms/${code}`,"PATCH",{state:"play",startAt:Date.now()+room.off+3500});});
   o.querySelector("[data-leave]").onclick=async()=>{await api(`rooms/${code}/players/${pid}`,"DELETE").catch(()=>{});stopRoom();try{history.replaceState(null,"",location.pathname)}catch{}pick("ghost");};}
 };
 const tickRoom=async()=>{if(!room)return;let r;try{r=await api(`rooms/${code}`);}catch{return;}if(!r||!room)return;
  if(room.phase==="lobby"){if(r.state==="play"&&r.startAt){room.phase="count";countdown(r);}else draw(r);}
  else{const ps=Object.entries(r.players||{}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));const rb=$("#race");if(rb)rb.innerHTML=ps.map(([id,p])=>`<span class="${id===pid?"me":""}">${esc(p.name)} <b>${p.score||0}</b></span>`).join("");
   if(room.phase==="done"&&ps.every(([,p])=>p.done)){showResult(ps);}}};
 const countdown=r=>{const left=()=>Math.ceil((r.startAt-(Date.now()+room.off))/1000);o.innerHTML='<h2>準備</h2><div class="result" id="cd"></div><p>同一批幽靈，看誰手快！</p>';
  const iv=setInterval(()=>{const l=left();const cd=document.getElementById("cd");if(cd)cd.textContent=l>0?l:"GO!";if(l<=0){clearInterval(iv);room.phase="play";startBattle(r);}},100);};
 const startBattle=r=>{let last=0,pend=0;const push=sc=>{pend=sc;const now=Date.now();if(now-last>350){last=now;api(`rooms/${code}/players/${pid}/score`,"PUT",sc).catch(()=>{});}};
  ghostGame({battle:{seed:r.seed,onScore:push,onEnd:async sc=>{room.phase="done";await api(`rooms/${code}/players/${pid}`,"PATCH",{score:sc,done:true}).catch(()=>{});
   arena.insertAdjacentHTML("beforeend",'<div class="overlay"><h2>時間到！</h2><p>等其他人結算…</p></div>');}}});
  arena.insertAdjacentHTML("afterbegin",'<div class="race" id="race"></div>');};
 const showResult=ps=>{clearInterval(poll);poll=0;const sc=id=>(ps.find(([i])=>i===id)?.[1].score)||0;const place=id=>ps.filter(([,p])=>(p.score||0)>sc(id)).length;const me=place(pid);const tie=ps.filter(([,p])=>(p.score||0)===sc(pid)).length>1;arena.querySelectorAll(".overlay").forEach(e=>e.remove());
  share(`我在 JimFrame 萬聖節抓幽靈對戰拿到第 ${me+1} 名（${sc(pid)} 分）👻 下次換你 @jimframe`);
  const d=document.createElement("div");d.className="overlay";d.innerHTML=`<h2>${me===0?(tie?"🤝 平手！":"🏆 你贏了！"):"第 "+(me+1)+" 名"}</h2><ul class="plist">${ps.map(([id,p])=>`<li${id===pid?' class="me"':""}>${["🥇","🥈","🥉"][place(id)]||place(id)+1} ${esc(p.name)} <b>${p.score||0}</b></li>`).join("")}</ul>
  <div class="row"><button class="btn" type="button" data-again>再開一間</button><button class="btn ghost" type="button" data-copy>📋 複製戰績</button></div>`;arena.appendChild(d);
  d.querySelector("[data-again]").onclick=()=>{stopRoom();openLobby();};d.querySelector("[data-copy]").onclick=e=>copyShare(e.currentTarget);};
 poll=setInterval(tickRoom,800);tickRoom();}

const games={ghost:ghostGame,candy:candyGame,memory:memoryGame};
function pick(g){clearAll();stopRoom();game=g;if(DB)loadBoard(g);document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.g===g)));games[g]();}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>pick(b.dataset.g));
async function copyShare(btn){let t=played?$("#share-text").textContent:bestText();if(!t){btn.textContent="先玩完一場再複製";setTimeout(()=>btn.textContent=btn.dataset.copy!==undefined?"📋 複製戰績":"複製戰績",2000);return;}$("#share-text").textContent=t;const label=btn.textContent;
 try{await navigator.clipboard.writeText(t);btn.textContent="已複製 ✓";}catch{const r=document.createRange();r.selectNodeContents($("#share-text"));const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="已選取，長按複製";}setTimeout(()=>btn.textContent=label,2000);}
$("#copy").onclick=e=>copyShare(e.currentTarget);
showBest();if(DB){$("#board").hidden=false;document.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{boardScope=b.dataset.scope;document.querySelectorAll("[data-scope]").forEach(o=>o.setAttribute("aria-pressed",String(o===b)));loadBoard();});}
const h=location.hash.slice(1);pick(games[h]?h:"ghost");const rc=new URLSearchParams(location.search).get("room");if(DB&&rc){pick("ghost");openLobby(rc.toUpperCase().slice(0,4));}
})();
</script>
</body></html>
