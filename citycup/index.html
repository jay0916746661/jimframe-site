function show(){const p=day.photos[idx];$("#big").src=day.dir+p[0]+".jpg";$("#cnt").textContent=`${idx+1} / ${day.photos.length}`;
 [idx+1,idx-1].forEach(j=>{const q=day.photos[(j+day.photos.length)%day.photos.length];new Image().src=day.dir+q[0]+".jpg"})}
function open(i){idx=i;$("#lb").classList.add("on");document.body.style.overflow="hidden";show()}
function close(){$("#lb").classList.remove("on");document.body.style.overflow=""}
function step(d){idx=(idx+d+day.photos.length)%day.photos.length;show()}
function dl(){const p=day.photos[idx];const a=document.createElement("a");a.href=day.dir+p[0]+".jpg";a.download="CityCup2026_"+p[0]+".jpg";document.body.appendChild(a);a.click();a.remove()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.d){day=DAYS.find(d=>d.id===t.dataset.d);history.replaceState(null,"","#"+day.id);view()}
 else if(t.dataset.i!==undefined)open(+t.dataset.i);
 else if("x" in t.dataset)close();else if("p" in t.dataset)step(-1);else if("n" in t.dataset)step(1);
 else if("dl" in t.dataset){if(acked)dl();else{$("#ok").checked=false;$("[data-go]").disabled=true;$("#credit").classList.add("on")}}
 else if("cc" in t.dataset)$("#credit").classList.remove("on");
 else if("go" in t.dataset){acked=true;try{localStorage.setItem("jf_cc_ack","1")}catch(e){}$("#credit").classList.remove("on");dl()}});
$("#ok").addEventListener("change",e=>{$("[data-go]").disabled=!e.target.checked});
document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
let sx=null;$("#stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("#stage").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)step(dx<0?1:-1);sx=null});
view();
</script></body></html>
